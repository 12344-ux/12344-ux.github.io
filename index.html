<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magandhi · Operaciones Internas</title>
<meta name="description" content="Panel de Operaciones Internas de Magandhi Corporation.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png?v=1">
<link rel="apple-touch-icon" href="icono-app-180.png?v=1">
<meta name="theme-color" content="#A6332E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marca.css?v=1">

<!--
  MAGANDHI · portada de OPERACIONES INTERNAS (back-office, montaguth.institute).
  · Landing estática, sin login ni backend (fases futuras).
  · Sistema de marca en marca.css (fuente única de la paleta terracota).
  · Sobrio, institucional, boutique. El dorado (--acento) solo en detalles
    mínimos, nunca como marco grande junto al terracota.
  · Prefijo mg- para el CSS específico de esta página.
-->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--hueso);
    color:var(--tinta);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }

  /* sutil textura de fondo: dos halos crema muy leves, nada estridente */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 55% at 50% 0%, rgba(166,51,46,.05) 0%, rgba(166,51,46,0) 70%),
      radial-gradient(50% 50% at 50% 100%, rgba(17,17,17,.03) 0%, rgba(17,17,17,0) 70%);
  }

  .mg-wrap{
    position:relative;z-index:1;
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:48px 24px;
  }

  .mg-panel{
    width:100%;max-width:520px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:26px;
  }

  /* marca */
  .mg-logo{width:96px;height:96px;display:block}
  .mg-brand{display:flex;flex-direction:column;align-items:center;gap:10px}
  /* wordmark MAGANDHI: negro con la A central en terracota (estilo de marca) */
  .mg-word{
    font-weight:600;font-size:30px;letter-spacing:.18em;color:var(--negro);
    line-height:1;text-indent:.18em;
  }
  .mg-word em{font-style:normal;color:var(--rojo)}
  /* filete dorado mínimo, solo un detalle fino (no marco grande) */
  .mg-rule{
    width:44px;height:2px;border-radius:2px;
    background:var(--acento);opacity:.9;
  }

  /* slogan / rol del dominio */
  .mg-slogan{
    max-width:400px;margin:0;
    font-size:clamp(15px,2.4vw,17px);color:var(--gris);font-weight:400;
  }
  .mg-slogan strong{color:var(--negro);font-weight:600}
  .mg-slogan em{font-style:normal;color:var(--rojo);font-weight:600}

  /* etiqueta de contexto (interno) */
  .mg-tag{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--rojo);
    background:var(--red-50);border:1px solid var(--red-100);
    border-radius:999px;padding:7px 15px;
  }
  .mg-tag svg{width:13px;height:13px}

  /* pie institucional */
  .mg-foot{
    position:relative;z-index:1;
    padding:22px 24px 28px;text-align:center;
    font-size:11.5px;letter-spacing:.06em;color:var(--gris-cl);
  }
  .mg-foot span{color:var(--rojo)}
</style>
</head>
<body>

<main class="mg-wrap">
  <div class="mg-panel">
    <div class="mg-brand">
      <img class="mg-logo" src="logo-mark-terracota.png" alt="Magandhi">
      <div class="mg-word">M<em>A</em>GANDHI</div>
      <div class="mg-rule"></div>
    </div>

    <span class="mg-tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Acceso interno
    </span>

    <p class="mg-slogan">
      <em>Operaciones Internas</em> · <strong>Magandhi Corporation</strong>
    </p>
  </div>
</main>

<footer class="mg-foot">
  &copy; <span>Magandhi Corporation</span> · Uso interno
</footer>

</body>
</html>
