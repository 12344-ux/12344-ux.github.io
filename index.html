<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montaguth Institute — Realismo Informativo</title>
    <style>
        :root {
            --fondo: #030712;
            --texto-principal: #ffffff;
            --texto-secundario: #9ca3af;
            --gris-oscuro: #1f2937;
            --borde: rgba(255, 255, 255, 0.08);
            --azul-acento: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--fondo);
            color: var(--texto-principal);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px;
        }

        /* Encabezado Institucional Premium */
        .header-brand {
            margin-top: 60px;
            text-align: center;
        }

        .brand-logo {
            font-size: 20px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #ffffff;
            opacity: 0.9;
        }

        /* Frase Principal - Impacto Subconsciente Magnético (Imagen 1) */
        .hero-section {
            max-width: 900px;
            width: 90%;
            margin-top: 90px;
            text-align: center;
        }

        .hero-title {
            font-family: 'Georgia', serif;
            font-size: 46px;
            font-weight: 400;
            line-height: 1.3;
            color: var(--texto-principal);
            letter-spacing: -0.5px;
        }

        /* Botón de Filosofía Minimalista */
        .philosophy-container {
            margin-top: 45px;
            text-align: center;
        }

        .philosophy-btn {
            display: inline-block;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--texto-secundario);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 3px;
            padding: 14px 35px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .philosophy-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.02);
        }

        /* Umbral Elegante: Espacio generoso y línea fina sugerida por el experto */
        .divider-section {
            width: 85%;
            max-width: 850px;
            margin-top: 140px;
            margin-bottom: 40px;
        }

        .divider-line {
            border: none;
            border-top: 1px solid var(--borde);
            margin-bottom: 25px;
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #4b5563;
            font-weight: 600;
        }

        /* Bloques de Investigaciones Activas con el botón + (Imagen 1) */
        .content-container {
            width: 85%;
            max-width: 850px;
        }

        .investigation-card {
            border: 1px solid var(--borde);
            background: rgba(255, 255, 255, 0.01);
            padding: 35px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .investigation-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.02);
        }

        .card-info {
            flex: 1;
            padding-right: 30px;
        }

        .card-title {
            font-family: 'Georgia', serif;
            font-size: 24px;
            font-weight: 400;
            color: var(--texto-principal);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .card-date {
            font-size: 12px;
            color: #4b5563;
        }

        /* El icónico botón + de la Imagen 1 */
        .expand-icon-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--azul-acento);
            font-size: 18px;
            font-weight: 300;
            transition: all 0.3s ease;
            background: transparent;
        }

        .investigation-card:hover .expand-icon-btn {
            border-color: var(--azul-acento);
            background: rgba(56, 189, 248, 0.05);
        }

        /* Optimización Responsive para móviles */
        @media (max-width: 768px) {
            .hero-title { font-size: 32px; }
            .card-title { font-size: 20px; }
            .investigation-card { padding: 25px 20px; }
            .divider-section { margin-top: 90px; }
        }
    </style>
</head>
<body>

    <header class="header-brand">
        <div class="brand-logo">Montaguth Institute</div>
    </header>

    <section class="hero-section">
        <h1 class="hero-title">Llega un punto exacto en el que buscar respuestas se convierte en el problema.</h1>
    </section>

    <div class="philosophy-container">
        <a href="#manifiesto" class="philosophy-btn">Nuestra Filosofía</a>
    </div>

    <div class="divider-section">
        <hr class="divider-line">
        <div class="section-label">Investigaciones Activas</div>
    </div>

    <main class="content-container">
        <a href="investigacion-alarmas.html" class="investigation-card">
            <div class="card-info">
                <h2 class="card-title">La fisiología del despertar forzado y el trauma metabólico de las alarmas</h2>
                <span class="card-date">Publicado el 22 de mayo de 2026</span>
            </div>
            <div class="expand-icon-btn">+</div>
        </a>
    </main>

</body>
</html>
