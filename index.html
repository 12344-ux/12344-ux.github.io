<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montaguth Institute</title>
    <style>
        :root {
            --fondo: #050a14;
            --azul-acento: #38bdf8;
            --texto-principal: #f8fafc;
        }
        
        body {
            background-color: var(--fondo);
            color: var(--texto-principal);
            font-family: 'Georgia', serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header { margin-bottom: 60px; }
        .logo { 
            font-family: sans-serif; font-size: 18px; 
            letter-spacing: 8px; text-transform: uppercase; 
            color: #94a3b8; margin: 0;
        }

        /* La Frase de Oro */
        .frase-hero {
            max-width: 800px; width: 90%;
            text-align: center;
            font-size: 32px; line-height: 1.4;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .btn-filosofia {
            background: transparent; color: var(--azul-acento);
            border: 1px solid var(--azul-acento);
            padding: 12px 30px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px;
            font-size: 12px; transition: 0.3s;
        }
        .btn-filosofia:hover { background: var(--azul-acento); color: var(--fondo); }

        @media (min-width: 768px) {
            .frase-hero { font-size: 42px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 class="logo">Montaguth Institute</h1>
    </header>

    <h2 class="frase-hero">"Llega un punto exacto en el que buscar respuestas se convierte en el problema."</h2>

    <button class="btn-filosofia" onclick="window.location.href='filosofia.html'">Nuestra Filosofía</button>

</body>
</html>
