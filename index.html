<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magandhi · Acceso interno</title>
<meta name="description" content="Acceso al back-office interno de Magandhi Corporation.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="marca-areas/control-interno.png?v=3">
<link rel="apple-touch-icon" href="icono-app-180.png?v=1">
<meta name="theme-color" content="#A6332E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="marca.css?v=1">

<!--
  MAGANDHI · pantalla de LOGIN del back-office interno (montaguth.institute).
  · Reutiliza el sistema de marca (marca.css, wordmark, Poppins, terracota).
  · Autenticacion con Supabase Auth (email + contrasena).
  · Sobrio, institucional, boutique. El dorado (--acento) solo en detalles
    minimos, nunca como marco grande junto al terracota.
  · Prefijo mg- para el CSS especifico de esta pagina.
  · SEGURIDAD: la publishable key es publica (protegida por RLS). La
    seguridad real esta en los datos, no en el HTML. Ver supabase-config.js.
-->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--hueso);
    color:var(--tinta);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }

  /* sutil textura de fondo: dos halos crema muy leves, nada estridente */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 55% at 50% 0%, rgba(166,51,46,.05) 0%, rgba(166,51,46,0) 70%),
      radial-gradient(50% 50% at 50% 100%, rgba(17,17,17,.03) 0%, rgba(17,17,17,0) 70%);
  }

  .mg-wrap{
    position:relative;z-index:1;
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:48px 24px;
  }

  .mg-panel{
    width:100%;max-width:420px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:24px;
  }

  /* marca */
  .mg-logo{width:84px;height:84px;display:block}
  .mg-brand{display:flex;flex-direction:column;align-items:center;gap:10px}
  /* wordmark MAGANDHI: negro con la A central en terracota (estilo de marca) */
  .mg-word{
    font-weight:600;font-size:28px;letter-spacing:.18em;color:var(--negro);
    line-height:1;text-indent:.18em;
  }
  .mg-word em{font-style:normal;color:var(--rojo)}
  /* filete dorado minimo, solo un detalle fino (no marco grande) */
  .mg-rule{
    width:44px;height:2px;border-radius:2px;
    background:var(--acento);opacity:.9;
  }

  /* etiqueta de contexto (interno) */
  .mg-tag{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--rojo);
    background:var(--red-50);border:1px solid var(--red-100);
    border-radius:999px;padding:7px 15px;
  }
  .mg-tag svg{width:13px;height:13px}

  /* tarjeta de formulario */
  .mg-card{
    width:100%;
    background:var(--tarjeta);
    border:1px solid var(--linea);
    border-radius:16px;
    padding:26px 24px;
    display:flex;flex-direction:column;gap:16px;
    text-align:left;
  }
  .mg-field{display:flex;flex-direction:column;gap:6px}
  .mg-label{
    font-size:12px;font-weight:600;letter-spacing:.04em;
    color:var(--gris);
  }
  .mg-input{
    font-family:inherit;font-size:15px;color:var(--tinta);
    background:var(--hueso);
    border:1px solid var(--linea);border-radius:10px;
    padding:11px 13px;width:100%;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .mg-input:focus{
    outline:none;
    border-color:var(--rojo);
    box-shadow:0 0 0 3px rgba(166,51,46,.12);
  }

  /* boton principal terracota */
  .mg-btn{
    font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.03em;
    color:#fff;background:var(--rojo);
    border:none;border-radius:10px;
    padding:12px 16px;width:100%;cursor:pointer;
    transition:background-color .15s ease;
  }
  .mg-btn:hover{background:var(--rojo-osc)}
  .mg-btn:disabled{opacity:.6;cursor:default}

  /* mensaje de error sobrio */
  .mg-msg{
    min-height:0;margin:0;
    font-size:13px;color:var(--rojo);
  }
  .mg-msg:empty{display:none}

  /* pie institucional */
  .mg-foot{
    position:relative;z-index:1;
    padding:22px 24px 28px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    font-size:11.5px;letter-spacing:.06em;color:var(--gris-cl);
  }
  .mg-foot span{color:var(--rojo)}
  /* Sello de proveedor "Con tecnologia Impulse": firma sobria, gris tenue,
     "Impulse" con peso ligeramente destacado. Solo back-office interno. */
  .mg-sello{
    font-size:11px;letter-spacing:.05em;color:var(--gris-cl);
  }
  .mg-sello b{color:var(--negro);font-weight:600;letter-spacing:.06em}
</style>
</head>
<body>

<main class="mg-wrap">
  <div class="mg-panel">
    <div class="mg-brand">
      <img class="mg-logo" src="logo-mark-terracota.png" alt="Magandhi">
      <div class="mg-word">M<em>A</em>GANDHI</div>
      <div class="mg-rule"></div>
    </div>

    <span class="mg-tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Solo personal interno
    </span>

    <form class="mg-card" id="mg-login" autocomplete="on">
      <div class="mg-field">
        <label class="mg-label" for="mg-email">Correo</label>
        <input class="mg-input" id="mg-email" name="email" type="email"
               autocomplete="username" required>
      </div>
      <div class="mg-field">
        <label class="mg-label" for="mg-pass">Contrasena</label>
        <input class="mg-input" id="mg-pass" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button class="mg-btn" id="mg-submit" type="submit">Acceder</button>
      <p class="mg-msg" id="mg-msg" role="alert" aria-live="polite"></p>
    </form>
  </div>
</main>

<footer class="mg-foot">
  <div>&copy; <span>Magandhi Corporation</span> · Uso interno</div>
  <div class="mg-sello">Con tecnología <b>Impulse</b></div>
</footer>

<script type="module">
  import { supabase } from './supabase-config.js';

  const form   = document.getElementById('mg-login');
  const submit = document.getElementById('mg-submit');
  const msg    = document.getElementById('mg-msg');

  // Si ya hay sesion valida al cargar, entrar directo al panel.
  (async () => {
    try {
      const { data } = await supabase.auth.getSession();
      if (data.session) window.location.replace('panel.html');
    } catch (_) { /* sin conexion: se queda en el login */ }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    submit.disabled = true;

    const email    = form.email.value.trim();
    const password = form.password.value;

    try {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        // Mensaje sobrio e institucional: no filtramos detalles tecnicos.
        msg.textContent = 'No pudimos verificar el acceso. Revisa tus datos e intentalo de nuevo.';
        submit.disabled = false;
        return;
      }
      window.location.replace('panel.html');
    } catch (_) {
      msg.textContent = 'No pudimos conectar en este momento. Intentalo de nuevo mas tarde.';
      submit.disabled = false;
    }
  });
</script>

</body>
</html>
