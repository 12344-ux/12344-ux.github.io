<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montaguth Institute</title>
    <style>
        :root {
            --fondo: #050a14;
            --azul-acento: #38bdf8;
            --texto-principal: #f8fafc;
            --gris-secundario: #94a3b8;
            --borde: rgba(255,255,255,0.1);
        }
        body {
            background-color: var(--fondo);
            color: var(--texto-principal);
            font-family: 'Georgia', serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 50px;
        }
        .header { margin-top: 60px; margin-bottom: 40px; }
        .logo {
            font-family: sans-serif; font-size: 18px;
            letter-spacing: 8px; text-transform: uppercase;
            color: var(--gris-secundario); margin: 0;
        }
        .frase-hero {
            max-width: 800px; width: 90%; text-align: center;
            font-size: 32px; line-height: 1.4; margin-bottom: 40px; font-weight: 300;
        }
        .btn-filosofia {
            background: transparent; color: var(--azul-acento);
            border: 1px solid var(--azul-acento);
            padding: 12px 30px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px;
            font-size: 12px; transition: 0.3s;
            margin-bottom: 50px;
        }
        .btn-filosofia:hover { background: var(--azul-acento); color: var(--fondo); }
        
        .buscador-container { text-align: center; width: 100%; margin-bottom: 60px; }
        .buscador {
            width: 85%; max-width: 400px; padding: 15px; 
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--borde); color: var(--gris-secundario);
            text-align: center; font-family: 'Georgia', serif; font-size: 14px;
        }

        /* ESTRUCTURA DEL ENSAYO */
        .ensayo-box {
            width: 90%; max-width: 600px;
            border: 1px solid var(--borde);
            padding: 30px; margin-top: 20px;
        }
        .ensayo-header { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .btn-desplegable {
            background: transparent; color: var(--azul-acento);
            border: 1px solid var(--azul-acento);
            padding: 5px 12px; cursor: pointer; font-family: sans-serif;
            font-size: 10px; text-transform: uppercase;
        }
        .titulo-ensayo { font-size: 22px; margin: 0; color: #fff; }
        .fecha { font-size: 12px; color: var(--gris-secundario); display: block; margin-top: 5px; }
        .btn-leer {
            display: inline-block; margin-top: 20px; color: var(--azul-acento);
            text-decoration: none; font-size: 14px; border-bottom: 1px solid var(--azul-acento);
        }

        @media (min-width: 768px) { .frase-hero { font-size: 42px; } }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="logo">Montaguth Institute</h1>
    </header>
    
    <h2 class="frase-hero">Llega un punto exacto en el que buscar respuestas se convierte en el problema.</h2>
    
    <button class="btn-filosofia" onclick="window.location.href='filosofia.html'">Nuestra Filosofía</button>

    <div class="buscador-container">
        <input type="text" class="buscador" placeholder="Busca un tema...">
    </div>

    <div class="ensayo-box">
        <div class="ensayo-header">
            <button class="btn-desplegable">+</button>
            <h3 class="titulo-ensayo">La fisiología del despertar forzado</h3>
        </div>
        <span class="fecha">Publicado el 22 de mayo de 2026</span>
        <a href="ensayo-alarmas.html" class="btn-leer">Leer ensayo completo →</a>
    </div>

</body>
</html>
