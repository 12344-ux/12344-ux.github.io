<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Tu guía · Stramont</title>
  <style>
    html,body{margin:0;height:100%;background:#0e1219;color:#eef2f8;
      font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
    #estado{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:28px;}
    .msg{max-width:440px;}
    .msg h1{font-size:23px;font-weight:800;margin:0 0 10px;}
    .msg p{color:#b9c4d6;font-size:15px;line-height:1.6;margin:0;}
    .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#41e0c9;
      margin-right:8px;animation:pal 1s ease-in-out infinite;}
    @keyframes pal{0%,100%{opacity:.3}50%{opacity:1}}
    #marco{border:0;width:100%;height:100vh;display:none;}
  </style>
</head>
<body>
  <div id="estado"><div class="msg"><h1><span class="dot"></span>Abriendo tu guía…</h1><p>Un momento, por favor.</p></div></div>
  <iframe id="marco" title="Guía Stramont"></iframe>
  <script>
    const FN = "https://ifvnuvjvlzpdaimelmbm.supabase.co/functions/v1/entrega";
    const p = new URLSearchParams(location.search);
    const f = p.get("f"), exp = p.get("exp"), sig = p.get("sig");
    const estado = document.getElementById("estado");
    const marco = document.getElementById("marco");
    function msg(t, s){ estado.innerHTML = '<div class="msg"><h1>'+t+'</h1><p>'+s+'</p></div>'; }
    (async () => {
      if (!f || !exp || !sig) { msg("Enlace no válido", "Este enlace no es correcto. Pídele a Stramont uno nuevo."); return; }
      try {
        const r = await fetch(`${FN}?f=${encodeURIComponent(f)}&exp=${encodeURIComponent(exp)}&sig=${encodeURIComponent(sig)}`);
        if (r.status === 410) { msg("Enlace expirado", "Esta guía ya no está disponible (venció su tiempo de acceso)."); return; }
        if (!r.ok) { msg("Enlace no válido", "No pudimos abrir esta guía. Verifica el enlace o pide uno nuevo."); return; }
        const html = await r.text();
        marco.srcdoc = html;
        estado.style.display = "none";
        marco.style.display = "block";
      } catch (e) {
        msg("Error de conexión", "No se pudo cargar la guía. Revisa tu internet e intenta de nuevo.");
      }
    })();
  </script>
</body>
</html>
