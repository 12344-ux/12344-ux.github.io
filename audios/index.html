<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Transcribir audio en inglés</title>
<style>
  :root{
    --fondo:#0B1220; --panel:#111C2E; --panel2:#0E1727; --linea:#1F2E45;
    --texto:#E9EDF5; --suave:#93A3BC; --acento:#2DD4BF; --rojo:#F87171;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--fondo); color:var(--texto);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .envoltura{max-width:760px; margin:0 auto; padding:44px 20px 56px}
  h1{font-size:27px; margin:0 0 6px; letter-spacing:-.02em}
  .sub{color:var(--suave); margin:0 0 26px; font-size:15px}

  /* ---- La zona: el único control de la página ---- */
  #zona{
    border:2px dashed var(--linea); border-radius:16px; padding:52px 22px; text-align:center;
    cursor:pointer; transition:border-color .18s, background .18s, opacity .18s;
    background:var(--panel);
  }
  #zona:hover,#zona.encima{border-color:var(--acento); background:rgba(45,212,191,.07)}
  #zona.ocupada{cursor:default; opacity:.75}
  #zona.ocupada:hover{border-color:var(--linea); background:var(--panel)}
  #zona svg{width:40px;height:40px;stroke:var(--acento);fill:none;stroke-width:1.6;margin-bottom:12px}
  #zonaTitulo{display:block; font-size:18px; font-weight:600; margin-bottom:5px}
  #zonaPie{color:var(--suave); font-size:14px}

  /* ---- Barra de estado ---- */
  #estado{margin-top:16px; display:none}
  .barra{height:6px; background:var(--panel2); border-radius:99px; overflow:hidden; border:1px solid var(--linea)}
  .barra i{display:block; height:100%; width:0%; background:var(--acento); transition:width .3s}
  .barra.indef i{width:100%; animation:vaiven 1.15s ease-in-out infinite; transform-origin:left}
  @keyframes vaiven{0%{transform:scaleX(.08) translateX(0)}50%{transform:scaleX(.5) translateX(120%)}100%{transform:scaleX(.08) translateX(1100%)}}
  #estadoTexto{font-size:13.5px; color:var(--suave); margin-top:9px; display:flex; justify-content:space-between; gap:12px}
  #estadoTexto b{color:var(--texto); font-weight:600}

  /* ---- Resultado ---- */
  #salida{display:none; margin-top:22px}
  #texto{
    background:var(--panel2); border:1px solid var(--linea); border-radius:12px; padding:20px;
    white-space:pre-wrap; font-size:16.5px; line-height:1.8; max-height:52vh; overflow:auto;
  }
  .pie{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap}
  #copiar{
    background:var(--acento); color:#06231F; border:0; border-radius:10px; padding:11px 20px;
    font:inherit; font-weight:700; cursor:pointer;
  }
  #copiar:hover{filter:brightness(1.1)}
  #meta{font-size:13px; color:var(--suave)}

  #error{
    display:none; margin-top:16px; background:rgba(248,113,113,.1);
    border:1px solid rgba(248,113,113,.4); color:#FCA5A5;
    padding:13px 15px; border-radius:11px; font-size:14px;
  }
  footer{margin-top:34px; font-size:12.5px; color:var(--suave); text-align:center; line-height:1.9}
  footer a{color:var(--acento)}
  footer .tec{opacity:.6; font-size:11.5px}
</style>
</head>
<body>
<div class="envoltura">

  <h1>Transcribir audio en inglés</h1>
  <p class="sub">Sueltas el audio y sale el texto. Todo pasa en tu dispositivo: el audio no se sube a ningún servidor.</p>

  <div id="zona" tabindex="0" role="button" aria-label="Elegir archivo de audio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
    <span id="zonaTitulo">Arrastra tu audio o haz clic</span>
    <span id="zonaPie">mp3 · wav · m4a · ogg · mp4</span>
  </div>
  <input type="file" id="archivo" accept="audio/*,video/*,.mp3,.wav,.m4a,.ogg,.opus,.mp4,.webm,.flac" hidden>

  <div id="estado">
    <div class="barra" id="barraCaja"><i id="barra"></i></div>
    <div id="estadoTexto"><span id="estadoIzq"></span><span id="estadoDer"></span></div>
  </div>

  <div id="salida">
    <div id="texto"></div>
    <div class="pie">
      <button id="copiar">Copiar el texto</button>
      <span id="meta"></span>
    </div>
  </div>

  <div id="error"></div>

  <footer>
    Motor <a href="https://github.com/openai/whisper" target="_blank" rel="noopener">Whisper</a> de OpenAI (MIT)
    sobre <a href="https://github.com/huggingface/transformers.js" target="_blank" rel="noopener">Transformers.js</a>.
    <br><span class="tec" id="tec"></span>
  </footer>
</div>

<!-- ===================== Hilo de trabajo ===================== -->
<script id="fuenteWorker" type="text/plain">
// ⚠️ VERSIÓN FIJADA A PROPÓSITO — NO CAMBIARLA SIN PROBAR EN NAVEGADOR REAL.
//  · 4.2.0 rompe Whisper en el navegador ("Missing required scale ...
//    MatMulNBits" al crear la sesión de ONNX; falla con q8, q4, int8 y fp32).
//  · 3.8.1 exige WebAssembly SIMD. Sin SIMD muere con
//    "no available backend found ... SIMD is not supported".
//  · 2.17.2 usa ONNX Runtime 1.14, que SÍ trae compilación sin SIMD.
//    Verificada con SIMD y sin SIMD. Es la única que sirve en los dos casos.
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

// Sin esto busca primero una carpeta /models/ local que no existe:
// 7 peticiones fallidas por modelo antes de ir al repositorio real.
env.allowLocalModels = false;
env.useBrowserCache = true;

const MODELO = 'Xenova/whisper-base.en';
let motor = null;

self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.tipo === 'precargar') {
      if (!motor) {
        motor = await pipeline('automatic-speech-recognition', MODELO, {
          quantized: true,
          progress_callback: (info) => {
            if (info.status === 'progress' && info.total) {
              self.postMessage({ tipo: 'descarga', archivo: info.file, cargado: info.loaded, total: info.total });
            }
          }
        });
      }
      self.postMessage({ tipo: 'listo' });

    } else if (m.tipo === 'bloque') {
      // return_timestamps ACTIVO a propósito: sin él el modelo entra en
      // bucles y repite frases. Los tokens de tiempo lo frenan.
      const salida = await motor(m.audio, {
        chunk_length_s: 30,
        stride_length_s: 5,
        return_timestamps: true
      });
      self.postMessage({
        tipo: 'bloque-listo',
        chunks: (salida.chunks || []).map(c => ({ timestamp: c.timestamp, text: c.text }))
      });
    }
  } catch (err) {
    self.postMessage({ tipo: 'error', mensaje: String((err && err.message) || err) });
  }
};
</script>

<script type="module">
const SR = 16000;
const BLOQUE_S = 120;

const $ = (id) => document.getElementById(id);
const zona = $('zona'), entrada = $('archivo');
const cajaEstado = $('estado'), barra = $('barra'), barraCaja = $('barraCaja');
const estadoIzq = $('estadoIzq'), estadoDer = $('estadoDer');
const cajaSalida = $('salida'), salidaTexto = $('texto'), meta = $('meta'), cajaErr = $('error');

let worker = null, esperando = null;
let motorListo = false, motorFallo = null;
let ocupado = false;
let pendiente = null;      // archivo elegido antes de que el motor esté listo
const descargas = {};

const mb = (b) => (b / 1048576).toFixed(1) + ' MB';
const mmss = (s) => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');

function estado(izq, der, pct) {
  cajaEstado.style.display = 'block';
  estadoIzq.textContent = izq;
  estadoDer.innerHTML = der || '';
  if (pct == null) { barraCaja.classList.add('indef'); }
  else { barraCaja.classList.remove('indef'); barra.style.width = Math.min(100, pct) + '%'; }
}
function fallar(msg) {
  cajaErr.textContent = msg;
  cajaErr.style.display = 'block';
  cajaEstado.style.display = 'none';
}
function zonaDice(titulo, pie, ocupadaAhora) {
  $('zonaTitulo').textContent = titulo;
  $('zonaPie').textContent = pie;
  zona.classList.toggle('ocupada', !!ocupadaAhora);
}

/* ---------- Hilo de trabajo ---------- */
function crearWorker() {
  const url = URL.createObjectURL(new Blob([$('fuenteWorker').textContent], { type: 'text/javascript' }));
  const w = new Worker(url, { type: 'module' });
  w.onmessage = (e) => {
    const m = e.data;
    if (m.tipo === 'descarga') {
      descargas[m.archivo] = { cargado: m.cargado, total: m.total };
      let c = 0, t = 0;
      for (const k in descargas) { c += descargas[k].cargado; t += descargas[k].total; }
      if (t && !motorListo) {
        estado('Preparando el motor · solo la primera vez', '<b>' + mb(c) + '</b> de ' + mb(t), c / t * 100);
      }
      return;
    }
    if (esperando) { const r = esperando; esperando = null; m.tipo === 'error' ? r.rechazar(new Error(m.mensaje)) : r.resolver(m); }
  };
  w.onerror = (ev) => {
    if (esperando) { const r = esperando; esperando = null; r.rechazar(new Error(ev.message || 'falló el hilo de trabajo')); }
  };
  return w;
}
const pedir = (mensaje, transferibles) => new Promise((resolver, rechazar) => {
  esperando = { resolver, rechazar };
  worker.postMessage(mensaje, transferibles || []);
});

/* ---------- Precarga: empieza al abrir la página ----------
   Así el motor viene cargando mientras la persona elige el archivo. */
(async function precargar() {
  try {
    worker = crearWorker();
    estado('Preparando el motor · solo la primera vez', '', null);
    await pedir({ tipo: 'precargar' });
    motorListo = true;
    if (pendiente) { const f = pendiente; pendiente = null; procesar(f); }
    else { cajaEstado.style.display = 'none'; zonaDice('Arrastra tu audio o haz clic', 'Listo para transcribir'); }
  } catch (err) {
    motorFallo = err;
    fallar('No pude preparar el motor de transcripción: ' + err.message);
  }
})();

/* ---------- Elegir archivo ---------- */
zona.addEventListener('click', () => { if (!ocupado) entrada.click(); });
zona.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && !ocupado) { e.preventDefault(); entrada.click(); }
});
['dragenter', 'dragover'].forEach(ev => zona.addEventListener(ev, (e) => {
  e.preventDefault(); if (!ocupado) zona.classList.add('encima');
}));
['dragleave', 'drop'].forEach(ev => zona.addEventListener(ev, () => zona.classList.remove('encima')));
zona.addEventListener('drop', (e) => {
  e.preventDefault();
  if (!ocupado && e.dataTransfer.files[0]) recibir(e.dataTransfer.files[0]);
});
entrada.addEventListener('change', () => { if (entrada.files[0]) recibir(entrada.files[0]); entrada.value = ''; });

function recibir(archivo) {
  if (ocupado) return;
  cajaErr.style.display = 'none';
  if (motorFallo) { fallar('El motor no está disponible: ' + motorFallo.message); return; }
  if (!motorListo) {                      // aún descargando: lo dejamos en cola
    pendiente = archivo;
    zonaDice(archivo.name, 'En cola · arranca en cuanto el motor esté listo', true);
    return;
  }
  procesar(archivo);
}

/* ---------- Transcribir ---------- */
async function procesar(archivo) {
  ocupado = true;
  cajaSalida.style.display = 'none';
  salidaTexto.textContent = '';
  zonaDice(archivo.name, 'Procesando…', true);
  estado('Leyendo el audio…', '', null);

  const t0 = Date.now();
  try {
    const audio = await aMono16k(await archivo.arrayBuffer());
    const duracion = audio.length / SR;

    // Bloques encadenados: cada uno arranca donde terminó el último segmento
    // completo del anterior. Sin solape y sin huecos en las costuras.
    const segmentos = [];
    let pos = 0;
    while (pos < duracion - 0.3) {
      const fin = Math.min(duracion, pos + BLOQUE_S);
      const esUltimo = fin >= duracion - 0.05;

      if (duracion > BLOQUE_S) {
        estado('Transcribiendo · ' + mmss(pos) + ' de ' + mmss(duracion), '', pos / duracion * 100);
      } else {
        estado('Transcribiendo…', '', null);
      }

      const trozo = audio.slice(Math.round(pos * SR), Math.round(fin * SR));
      const res = await pedir({ tipo: 'bloque', audio: trozo }, [trozo.buffer]);

      const segs = (res.chunks || [])
        .filter(c => String(c.text).trim().length)
        .map(c => {
          const a = (c.timestamp && c.timestamp[0] != null) ? c.timestamp[0] : 0;
          const b = (c.timestamp && c.timestamp[1] != null) ? c.timestamp[1] : a;
          return { ini: a + pos, fin: b + pos, text: c.text };
        });
      if (!segs.length) { pos = fin; continue; }

      if (esUltimo) { segmentos.push(...segs); pos = fin; }
      else {
        // El último segmento viene cortado a mitad de frase: se descarta y
        // se vuelve a transcribir al inicio del bloque siguiente.
        const guardar = segs.slice(0, -1);
        let sig = guardar.length ? guardar[guardar.length - 1].fin : null;
        if (sig == null || !isFinite(sig) || sig <= pos + 1) { segmentos.push(...segs); sig = fin; }
        else { segmentos.push(...guardar); }
        pos = sig;
      }
      if (segmentos.length) {
        salidaTexto.textContent = segmentos.map(s => s.text.trim()).join(' ');
        cajaSalida.style.display = 'block';
      }
    }

    const limpio = limpiarRepeticiones(segmentos);
    salidaTexto.textContent = limpio.texto;
    cajaSalida.style.display = 'block';

    const seg = (Date.now() - t0) / 1000;
    const palabras = limpio.texto.split(/\s+/).filter(Boolean).length;
    meta.textContent = palabras + ' palabras · ' + mmss(duracion) + ' de audio en ' + seg.toFixed(0) + 's' +
      (limpio.quitadas ? ' · quité ' + limpio.quitadas + ' palabras repetidas' : '');
    cajaEstado.style.display = 'none';
    zonaDice('Arrastra otro audio o haz clic', 'Listo');

  } catch (err) {
    fallar('No pude transcribir ese archivo: ' + err.message);
    zonaDice('Arrastra tu audio o haz clic', 'Intenta con otro archivo');
  } finally {
    ocupado = false;
  }
}

/* ---------- Decodificar a mono 16 kHz ---------- */
async function aMono16k(arrayBuffer) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const tmp = new Ctx();
  let dec;
  try { dec = await tmp.decodeAudioData(arrayBuffer); } finally { tmp.close(); }
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(dec.duration * SR)), SR);
  const src = off.createBufferSource();
  src.buffer = dec;
  src.connect(off.destination);
  src.start();
  return (await off.startRendering()).getChannelData(0);
}

/* ---------- Red de seguridad: repeticiones del modelo ----------
   Whisper a veces se queda en bucle. Borra bloques de 5+ palabras que
   aparecen dos veces SEGUIDAS. Coincidencia exacta a propósito: difuso
   borraría texto legítimo (lo comprobé: en las costuras el modelo repite
   el contenido con palabras distintas). */
function limpiarRepeticiones(segs, minPalabras = 5, maxVentana = 60) {
  const palabras = [];
  for (const s of segs) for (const w of String(s.text).trim().split(/\s+/)) if (w) palabras.push(w);
  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9']/g, '');
  const n = palabras.map(norm);
  const antes = palabras.length;

  let i = 0;
  while (i + 2 * minPalabras <= palabras.length) {
    const maxN = Math.min(maxVentana, Math.floor((palabras.length - i) / 2));
    let mejor = 0;
    for (let k = minPalabras; k <= maxN; k++) {
      let igual = true;
      for (let j = 0; j < k; j++) if (n[i + j] !== n[i + k + j]) { igual = false; break; }
      if (igual) mejor = k;
    }
    if (mejor) { palabras.splice(i + mejor, mejor); n.splice(i + mejor, mejor); }
    else i++;
  }
  return { texto: palabras.join(' '), quitadas: antes - palabras.length };
}

/* ---------- Copiar ---------- */
$('copiar').addEventListener('click', async () => {
  const b = $('copiar');
  try { await navigator.clipboard.writeText(salidaTexto.textContent); b.textContent = '¡Copiado!'; }
  catch (_) { b.textContent = 'No se pudo copiar'; }
  setTimeout(() => { b.textContent = 'Copiar el texto'; }, 1600);
});

/* ---------- Nota técnica al pie (para diagnosticar sin abrir la consola) ---------- */
(function () {
  const simd = (() => {
    try {
      return WebAssembly.validate(new Uint8Array(
        [0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]));
    } catch (_) { return false; }
  })();
  $('tec').textContent = 'whisper-base.en · WebAssembly · SIMD ' + (simd ? 'sí' : 'no');
})();
</script>
</body>
</html>
