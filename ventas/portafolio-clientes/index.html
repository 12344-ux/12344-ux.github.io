<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magandhi · Portafolio de clientes</title>
<meta name="description" content="Portafolio de clientes · Área de Ventas de Magandhi.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../../marca-areas/ventas.png?v=1">
<link rel="apple-touch-icon" href="../../icono-app-180.png?v=2">
<meta name="theme-color" content="#101C33">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../marca.css?v=2">
<link rel="stylesheet" href="../ventas.css?v=1">

<!--
  MAGANDHI · Area de Ventas · Portafolio de clientes · LISTA.
  La cartera de clientes con sus metricas OBJETIVAS derivadas de pedidos reales
  (vista portafolio_metricas: ultima_compra, num_pedidos, total_gastado). Se
  cruza con clientes para el contacto (correo/telefono/ciudad). Ordenable por
  total gastado, recencia, pedidos o nombre (orden en el SERVIDOR sobre toda la
  cartera) y con buscador por nombre/correo/telefono que consulta TODA la
  cartera (Tramo 0). Cada fila enlaza a ver.html?id=<customer_id>.

  SOLO EL DATO OBJETIVO (regla de identidad de Impulse): aqui NO se interpreta
  la "salud" del cliente (sano / en riesgo / dormido). Eso es trabajo del
  Analisis Cluster futuro. El candado real es RLS; ocultar UI es comodidad.
-->
</head>
<body class="vt-body">

<script type="module" src="../../auth-guard.js"></script>

<main class="vt-wrap" id="vt-main" hidden>
  <div class="vt-barra">
    <input class="vt-input vt-crece" id="vt-buscar" type="search" placeholder="Buscar por nombre, correo o teléfono…" aria-label="Buscar cliente">
    <select class="vt-select" id="vt-orden" style="max-width:250px" aria-label="Ordenar">
      <option value="total_desc">Mayor total gastado</option>
      <option value="total_asc">Menor total gastado</option>
      <option value="reciente">Compra más reciente</option>
      <option value="antigua">Compra más antigua</option>
      <option value="pedidos_desc">Más pedidos</option>
      <option value="nombre">Nombre (A–Z)</option>
    </select>
  </div>

  <p class="vt-nota"><span data-ico="info"></span>
    <span>Cifras objetivas derivadas de pedidos reales (cuánto, cada cuánto, cuándo). El portafolio no interpreta la salud del cliente: eso llegará con el análisis de segmentos.</span>
  </p>

  <div id="vt-lista"><p class="vt-empty">Cargando clientes...</p></div>
</main>

<script type="module">
  import {
    supabase, asegurarAcceso, montarHeader, ICONOS,
    escaparHTML, formatearCOP, formatearFecha
  } from '../ventas-core.js';

  const main = document.getElementById('vt-main');
  const lista = document.getElementById('vt-lista');
  const buscar = document.getElementById('vt-buscar');
  const orden = document.getElementById('vt-orden');

  // ============================================================
  // TRAMO 0 · BUSQUEDA GLOBAL REAL (antes era falsa)
  // ------------------------------------------------------------
  // ANTES: se traian 2.000 clientes y el buscador filtraba SOLO esos en
  // memoria, pero el aviso decia "usa el buscador para encontrar uno del
  // resto". Era imposible: el resto nunca llegaba al navegador. Ademas el
  // contacto se hidrataba con otros 2.000 clientes sin relacion con los
  // primeros (algunos salian sin correo/telefono) y el orden se aplicaba solo
  // sobre la muestra.
  //
  // AHORA, dos modos, ambos contra TODA la cartera en el servidor:
  //   · LISTADO (sin texto): portafolio_metricas se ORDENA EN EL SERVIDOR con el
  //     criterio elegido (desempate estable por customer_id) y se traen los
  //     primeros CLIENTES_N. Cambiar el orden vuelve a consultar.
  //   · BUSQUEDA (2+ caracteres): se busca en clientes por nombre, correo,
  //     telefono (tal cual y solo digitos). Las coincidencias se cruzan con sus
  //     metricas y se ordenan en el navegador (son <= CLIENTES_N).
  // El contacto se trae SOLO para los ids mostrados, en lotes.
  // Patron N+1 para detectar truncamiento (como el Libro Diario e Inventario).
  // ============================================================
  const CLIENTES_N = 2000; // maximo de clientes que se pintan a la vez
  const LOTE_IDS = 150;     // ids por consulta .in() (URL corta y segura)
  const MIN_BUSQUEDA = 2;

  // Criterio de orden del selector -> columna de portafolio_metricas.
  const ORDEN_SERVIDOR = {
    total_desc:   { col: 'total_gastado', asc: false },
    total_asc:    { col: 'total_gastado', asc: true },
    reciente:     { col: 'ultima_compra', asc: false },
    antigua:      { col: 'ultima_compra', asc: true },
    pedidos_desc: { col: 'num_pedidos',   asc: false },
    nombre:       { col: 'nombre',        asc: true }
  };

  let filas = [];
  let hayMas = false;
  let modoBusqueda = false;
  let consultaActual = 0; // descarta respuestas viejas si el usuario sigue escribiendo

  // Mismo saneamiento que Inventario: quita los caracteres con significado en
  // el filtro .or() de PostgREST y el comodin %.
  function limpiarTermino(q) {
    return String(q).replace(/[,()%*\\]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function enLotes(arr, n) {
    const out = [];
    for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    return out;
  }

  // Contacto (correo/telefono/ciudad) SOLO de los ids pedidos, en lotes.
  async function contactosDe(ids) {
    const mapa = new Map();
    for (const lote of enLotes(ids, LOTE_IDS)) {
      const { data, error } = await supabase
        .from('clientes').select('id, correo, telefono, ciudad').in('id', lote);
      if (error) throw error;
      (data || []).forEach((c) => mapa.set(c.id, c));
    }
    return mapa;
  }

  // Metricas SOLO de los ids pedidos, en lotes (modo busqueda).
  async function metricasDe(ids) {
    const out = [];
    for (const lote of enLotes(ids, LOTE_IDS)) {
      const { data, error } = await supabase
        .from('portafolio_metricas')
        .select('customer_id, nombre, ultima_compra, num_pedidos, total_gastado')
        .in('customer_id', lote);
      if (error) throw error;
      out.push(...(data || []));
    }
    return out;
  }

  function armarFilas(metricas, contactoPorId) {
    return metricas.map((m) => {
      const c = contactoPorId.get(m.customer_id) || {};
      return {
        id: m.customer_id,
        nombre: m.nombre || 'Sin nombre',
        correo: c.correo || '',
        telefono: c.telefono || '',
        ciudad: c.ciudad || '',
        ultima_compra: m.ultima_compra || null,
        num_pedidos: Number(m.num_pedidos) || 0,
        total_gastado: Number(m.total_gastado) || 0
      };
    });
  }

  async function cargar() {
    const miConsulta = ++consultaActual;
    const termino = limpiarTermino(buscar.value);
    modoBusqueda = termino.length >= MIN_BUSQUEDA;
    lista.innerHTML = '<p class="vt-empty">' + (modoBusqueda ? 'Buscando en toda la cartera...' : 'Cargando clientes...') + '</p>';

    try {
      let metricas;
      if (modoBusqueda) {
        // Busca en TODA la tabla clientes (no en una muestra).
        const patron = '%' + termino + '%';
        const filtros = ['nombre.ilike.' + patron, 'correo.ilike.' + patron, 'telefono.ilike.' + patron];
        const digitos = termino.replace(/\D/g, '');
        if (digitos.length >= MIN_BUSQUEDA) filtros.push('telefono_norm.ilike.%' + digitos + '%');
        const { data: encontrados, error } = await supabase
          .from('clientes').select('id').or(filtros.join(','))
          .order('id', { ascending: true })
          .limit(CLIENTES_N + 1);
        if (error) throw error;
        const ids = (encontrados || []).map((c) => c.id);
        hayMas = ids.length > CLIENTES_N;
        metricas = await metricasDe(hayMas ? ids.slice(0, CLIENTES_N) : ids);
      } else {
        // Listado ordenado EN EL SERVIDOR sobre toda la cartera.
        const o = ORDEN_SERVIDOR[orden.value] || ORDEN_SERVIDOR.total_desc;
        const { data, error } = await supabase
          .from('portafolio_metricas')
          .select('customer_id, nombre, ultima_compra, num_pedidos, total_gastado')
          .order(o.col, { ascending: o.asc, nullsFirst: false })
          .order('customer_id', { ascending: true })
          .limit(CLIENTES_N + 1);
        if (error) throw error;
        const todas = data || [];
        hayMas = todas.length > CLIENTES_N;
        metricas = hayMas ? todas.slice(0, CLIENTES_N) : todas;
      }

      // Contacto de los mismos ids que se muestran. Si falla, se degrada con
      // gracia (filas sin contacto) en vez de vaciar el portafolio.
      let contactoPorId = new Map();
      try { contactoPorId = await contactosDe(metricas.map((m) => m.customer_id)); }
      catch (e) { console.warn('No se pudo cargar el contacto de los clientes', e?.message || e); }

      if (miConsulta !== consultaActual) return; // llego una respuesta vieja
      filas = armarFilas(metricas, contactoPorId);
      pintar();
    } catch (e) {
      if (miConsulta !== consultaActual) return;
      lista.innerHTML = '<div class="vt-empty">No se pudo cargar el portafolio. <strong>' +
        escaparHTML(e?.message || 'Error') + '</strong></div>';
    }
  }

  function ordenar(arr) {
    const v = orden.value;
    const copia = arr.slice();
    const fecha = (x) => x.ultima_compra ? new Date(x.ultima_compra).getTime() : 0;
    // Desempate estable por id (igual que el orden del servidor).
    const desempate = (a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    switch (v) {
      case 'total_asc': copia.sort((a, b) => a.total_gastado - b.total_gastado || desempate(a, b)); break;
      case 'reciente': copia.sort((a, b) => fecha(b) - fecha(a) || desempate(a, b)); break;
      case 'antigua': copia.sort((a, b) => {
        // Sin compras al final, igual que el servidor (nulls last).
        if (!a.ultima_compra !== !b.ultima_compra) return a.ultima_compra ? -1 : 1;
        return fecha(a) - fecha(b) || desempate(a, b);
      }); break;
      case 'pedidos_desc': copia.sort((a, b) => b.num_pedidos - a.num_pedidos || desempate(a, b)); break;
      case 'nombre': copia.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es') || desempate(a, b)); break;
      case 'total_desc':
      default: copia.sort((a, b) => b.total_gastado - a.total_gastado || desempate(a, b)); break;
    }
    return copia;
  }

  function pintar() {
    const datos = ordenar(filas);
    if (!datos.length) {
      lista.innerHTML = modoBusqueda
        ? '<div class="vt-empty">Ningún cliente de la cartera coincide con la búsqueda.</div>'
        : '<div class="vt-empty">Aún no hay clientes en el portafolio. Se irán sumando conforme registres pedidos.</div>';
      return;
    }

    const cuerpo = datos.map((x) => {
      const contacto = [x.correo, x.telefono].filter(Boolean).map(escaparHTML).join('<br>') || '<span style="color:var(--vt-gris)">—</span>';
      return (
        '<tr>' +
          '<td class="cliente"><a href="ver.html?id=' + encodeURIComponent(x.id) + '" style="color:inherit;text-decoration:none">' + escaparHTML(x.nombre) + '</a></td>' +
          '<td style="font-size:12.5px">' + contacto + '</td>' +
          '<td>' + (x.ciudad ? escaparHTML(x.ciudad) : '<span style="color:var(--vt-gris)">—</span>') + '</td>' +
          '<td class="fecha">' + (x.ultima_compra ? escaparHTML(formatearFecha(x.ultima_compra)) : '<span style="color:var(--vt-gris)">Sin compras</span>') + '</td>' +
          '<td class="num">' + x.num_pedidos + '</td>' +
          '<td class="num">' + formatearCOP(x.total_gastado) + '</td>' +
        '</tr>'
      );
    }).join('');

    lista.innerHTML =
      '<div class="vt-tabla-caja"><table class="vt-tabla">' +
        '<thead><tr>' +
          '<th>Cliente</th>' +
          '<th>Contacto</th>' +
          '<th>Ciudad</th>' +
          '<th>Última compra</th>' +
          '<th class="num">Pedidos</th>' +
          '<th class="num">Total gastado</th>' +
        '</tr></thead>' +
        '<tbody>' + cuerpo + '</tbody>' +
      '</table></div>';

    // Aviso de truncamiento honesto (patron N+1), distinto segun el modo.
    if (hayMas) {
      const texto = modoBusqueda
        ? 'Hay más de ' + formatearCOP(CLIENTES_N) + ' clientes que coinciden. Escribe más letras o el correo/teléfono completo para acotar.'
        : 'Mostrando los primeros ' + formatearCOP(CLIENTES_N) + ' clientes según el orden elegido. Hay más en la cartera: ' +
          'el buscador consulta la cartera completa por nombre, correo o teléfono.';
      lista.insertAdjacentHTML('beforeend',
        '<div class="vt-truncado">' + (ICONOS.info || '') + '<span>' + escaparHTML(texto) + '</span></div>');
    }
  }

  // Buscar consulta el servidor (con pausa para no consultar en cada tecla).
  let tBuscar;
  buscar.addEventListener('input', () => {
    clearTimeout(tBuscar);
    tBuscar = setTimeout(cargar, 300);
  });
  // En modo busqueda las coincidencias ya estan todas: se reordena en el
  // navegador. En el listado el orden decide QUIENES aparecen: se reconsulta.
  // (Si una busqueda supera el maximo, el aviso pide acotarla.)
  orden.addEventListener('change', () => { if (modoBusqueda) pintar(); else cargar(); });

  (async () => {
    const acceso = await asegurarAcceso(document.body, '../../panel.html');
    if (!acceso) return;

    montarHeader({
      titulo: 'Portafolio de clientes',
      kicker: 'VENTAS · CARTERA',
      lead: 'La cartera de clientes con sus métricas derivadas de pedidos reales: cuánto han comprado, cuántas veces y cuándo fue la última. Ordena por total gastado o por recencia, o busca un cliente puntual.',
      sesion: acceso.sesion,
      areaLabel: 'ÁREA DE VENTAS',
      volverHref: '../index.html',
      volverTexto: 'Ventas'
    });
    document.querySelectorAll('main [data-ico]').forEach((el) => { el.innerHTML = ICONOS[el.dataset.ico] || ''; });

    main.hidden = false;
    await cargar();
  })();
</script>

</body>
</html>
