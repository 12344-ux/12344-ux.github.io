<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stramont · Anuncio</title>
<style>
  /* =========================================================================
     ANUNCIO STRAMONT — escena animada (cero dependencias) para grabar a video.
     Estilo "hero" limpio y premium. Adaptable por ?f=9x16 | 1x1 | 16x9.
     Timeline fija ~12s con CSS keyframes. Sin audio (se añade luego si se quiere).
     ========================================================================= */
  :root{
    --bg0:#0a0f18; --bg1:#0c1522; --bg2:#0e1c2e;
    --teal:#2DD4BF; --indigo:#6f8bf5; --indigo2:#7c8ff0;
    --ink:#eaf1fb; --dim:#9fb0c6; --muted:#6d7f96;
    --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    /* Duraciones de la línea de tiempo (ms convertidos a s en las animaciones) */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0);
    font-family:'DM Sans','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}

  /* ===== Escenario ===== */
  .stage{position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #12283f 0%, var(--bg1) 42%, var(--bg0) 78%);}
  /* Glows de marca */
  .glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.55;}
  .glow.g1{width:60vw;height:60vw;left:-12vw;top:-14vw;background:radial-gradient(circle,rgba(45,212,191,.42),transparent 66%);animation:drift1 12s ease-in-out infinite;}
  .glow.g2{width:64vw;height:64vw;right:-16vw;bottom:-18vw;background:radial-gradient(circle,rgba(111,139,245,.40),transparent 66%);animation:drift2 12s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(4vw,3vw)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-4vw,-3vw)}}
  /* Retícula sutil */
  .grid{position:absolute;inset:0;opacity:.05;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1px);
    background-size:34px 34px;mask-image:radial-gradient(120% 90% at 50% 40%,#000 30%,transparent 78%);
    -webkit-mask-image:radial-gradient(120% 90% at 50% 40%,#000 30%,transparent 78%);}

  /* ===== Marca superior persistente ===== */
  .topmark{position:absolute;top:6.2%;left:0;right:0;text-align:center;z-index:6;
    opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) .15s forwards;}
  .topmark .wm{display:inline-flex;align-items:center;gap:12px;}
  .topmark img{height:34px;width:auto;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4));}
  .topmark .name{font-size:26px;font-weight:800;letter-spacing:.5px;color:#fff;}
  .topmark .eyebrow{margin-top:10px;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--teal);font-weight:700;}

  /* ===== Dispositivo (teléfono) ===== */
  .device-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;
    opacity:0;animation:deviceIn 1s cubic-bezier(.16,.8,.24,1) .25s forwards;}
  .phone{position:relative;border-radius:60px;padding:16px;
    background:linear-gradient(160deg,#1b2637,#0f1826);
    box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.06) inset, 0 0 60px rgba(45,212,191,.12);
    animation:floaty 7s ease-in-out 1.2s infinite;}
  .phone::before{content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);
    width:36%;height:26px;background:#0a0f18;border-radius:0 0 18px 18px;z-index:3;}
  .screen{position:relative;overflow:hidden;border-radius:46px;background:#0a0e16;}
  .screen .shot{width:100%;display:block;animation:scrollUp 7.2s cubic-bezier(.5,0,.2,1) 1.6s forwards;}
  /* Brillo superior del screen */
  .screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:46px;
    box-shadow:0 0 0 1px rgba(255,255,255,.05) inset;
    background:linear-gradient(180deg,rgba(10,14,22,.35),transparent 12%);}

  /* ===== Tarjeta flotante "HOY ENTENDÍ" ===== */
  .card{position:absolute;z-index:7;width:300px;border-radius:20px;padding:22px 22px 20px;
    background:linear-gradient(160deg,#0e2b2b,#0b1a26);border:1px solid rgba(45,212,191,.4);
    box-shadow:0 30px 60px rgba(0,0,0,.55), 0 0 40px rgba(45,212,191,.16);
    opacity:0;animation:cardIn .9s cubic-bezier(.16,.8,.24,1) 6.6s forwards;}
  .card .k-eye{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--teal);font-weight:800;margin-bottom:10px;}
  .card .k-title{font-size:23px;font-weight:800;color:#fff;line-height:1.15;margin-bottom:12px;}
  .card .k-pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--teal);
    background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.4);border-radius:999px;padding:7px 13px;}
  .card .k-pill svg{width:15px;height:15px;stroke:var(--teal);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .card .k-foot{margin-top:14px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;}

  /* ===== Pills de método ===== */
  .pills{position:absolute;z-index:6;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .pill{font-size:15px;font-weight:700;color:var(--ink);background:var(--glass);border:1px solid var(--line);
    border-radius:999px;padding:11px 18px;backdrop-filter:blur(8px);opacity:0;display:inline-flex;align-items:center;gap:8px;}
  .pill svg{width:16px;height:16px;stroke:var(--teal);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .pill.p1{animation:pillIn .7s cubic-bezier(.16,.8,.24,1) 5.2s forwards;}
  .pill.p2{animation:pillIn .7s cubic-bezier(.16,.8,.24,1) 5.45s forwards;}
  .pill.p3{animation:pillIn .7s cubic-bezier(.16,.8,.24,1) 5.7s forwards;}

  /* ===== Captions (cambian) ===== */
  .caps{position:absolute;left:0;right:0;z-index:6;text-align:center;padding:0 8%;}
  .cap{position:absolute;left:8%;right:8%;font-weight:800;letter-spacing:-.4px;line-height:1.12;color:#fff;opacity:0;}
  .cap b{color:var(--teal);}
  .cap.c1{animation:capIO 3s cubic-bezier(.2,.7,.2,1) .7s forwards;}
  .cap.c2{animation:capIO 4.4s cubic-bezier(.2,.7,.2,1) 3.4s forwards;}

  /* ===== Outro ===== */
  .outro{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:0;background:radial-gradient(120% 80% at 50% 42%, #10263c 0%, var(--bg1) 46%, var(--bg0) 80%);
    opacity:0;animation:outroIn .8s cubic-bezier(.2,.7,.2,1) 8.5s forwards;}
  .outro .o-mark{opacity:0;animation:pop .9s cubic-bezier(.16,1,.3,1) 8.7s forwards;}
  .outro .o-mark img{height:96px;width:auto;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5));}
  .outro .o-name{font-size:64px;font-weight:800;color:#fff;letter-spacing:.5px;margin-top:14px;opacity:0;animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) 9.0s forwards;}
  .outro .o-tag{font-size:30px;font-weight:600;color:var(--dim);margin-top:14px;opacity:0;animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) 9.25s forwards;}
  .outro .o-tag b{color:var(--teal);font-weight:800;}
  .outro .o-cta{margin-top:34px;font-size:24px;font-weight:800;color:#04130f;background:linear-gradient(135deg,#39d7c4,#2a9d8f);
    padding:16px 34px;border-radius:16px;letter-spacing:.3px;opacity:0;box-shadow:0 16px 40px rgba(42,157,143,.4);
    animation:pop .8s cubic-bezier(.16,1,.3,1) 9.5s forwards;}
  .outro .o-url{margin-top:20px;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;opacity:0;animation:fadeUp .8s ease 9.75s forwards;}

  /* ===== Keyframes ===== */
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes deviceIn{from{opacity:0;transform:translate(-50%,calc(-50% + 80px)) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  @keyframes scrollUp{from{transform:translateY(0)}to{transform:translateY(var(--scroll,-42%))}}
  @keyframes capIO{0%{opacity:0;transform:translateY(16px)}14%{opacity:1;transform:translateY(0)}80%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-12px)}}
  @keyframes cardIn{from{opacity:0;transform:translate(var(--cx,40px),var(--cy,30px)) rotate(4deg) scale(.94)}to{opacity:1;transform:translate(0,0) rotate(-3deg) scale(1)}}
  @keyframes pillIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes outroIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.8)}60%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}

  /* =========================================================================
     LAYOUT POR FORMATO
     ========================================================================= */
  /* --- 9:16 (por defecto) --- */
  .f-9x16 .phone{width:660px;}
  .f-9x16 .screen{height:1240px;}
  .f-9x16 .screen .shot{--scroll:-40%;}
  .f-9x16 .caps{bottom:9%;}
  .f-9x16 .cap{font-size:52px;top:0;}
  .f-9x16 .pills{left:0;right:0;bottom:20%;}
  .f-9x16 .card{right:5%;top:24%;--cx:50px;--cy:20px;}
  .f-9x16 .device-wrap{top:47%;}

  /* --- 1:1 --- */
  .f-1x1 .topmark{top:5%;}
  .f-1x1 .phone{width:440px;}
  .f-1x1 .screen{height:760px;}
  .f-1x1 .screen .shot{--scroll:-34%;}
  .f-1x1 .device-wrap{left:32%;top:52%;}
  .f-1x1 .caps{left:52%;right:4%;top:34%;bottom:auto;text-align:left;padding:0;}
  .f-1x1 .cap{font-size:40px;left:0;right:0;}
  .f-1x1 .pills{left:52%;right:4%;bottom:20%;justify-content:flex-start;}
  .f-1x1 .card{left:50%;top:16%;--cx:-30px;--cy:-20px;}

  /* --- 16:9 --- */
  .f-16x9 .topmark{top:7%;}
  .f-16x9 .phone{width:400px;}
  .f-16x9 .screen{height:700px;}
  .f-16x9 .screen .shot{--scroll:-30%;}
  .f-16x9 .device-wrap{left:30%;top:54%;}
  .f-16x9 .caps{left:50%;right:5%;top:32%;bottom:auto;text-align:left;padding:0;}
  .f-16x9 .cap{font-size:52px;left:0;right:0;}
  .f-16x9 .pills{left:50%;right:5%;bottom:22%;justify-content:flex-start;}
  .f-16x9 .card{left:47%;top:14%;--cx:-30px;--cy:-20px;}
  .f-16x9 .outro .o-name{font-size:72px;}
</style>
</head>
<body>
  <div class="stage">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="grid"></div>

    <!-- Marca superior -->
    <div class="topmark">
      <span class="wm"><img src="../logo-mark.png" alt="Stramont"><span class="name">Stramont</span></span>
      <div class="eyebrow">Guía interactiva personalizada</div>
    </div>

    <!-- Dispositivo con la guía real -->
    <div class="device-wrap">
      <div class="phone">
        <div class="screen">
          <img class="shot" src="assets/guia-movil.png" alt="Guía Stramont">
        </div>
      </div>
    </div>

    <!-- Tarjeta HOY ENTENDÍ -->
    <div class="card">
      <div class="k-eye">Hoy entendí</div>
      <div class="k-title">Segmentación de Mercados</div>
      <span class="k-pill"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Tema comprendido</span>
      <div class="k-foot">montaguth.institute</div>
    </div>

    <!-- Pills de método -->
    <div class="pills">
      <span class="pill p1"><svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M3 12h18"/></svg> Explica simple</span>
      <span class="pill p2"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Pruébate</span>
      <span class="pill p3"><svg viewBox="0 0 24 24"><path d="M3 2v6h6"/><path d="M3 8a9 9 0 1 0 2.5-5.5"/></svg> Repaso</span>
    </div>

    <!-- Captions -->
    <div class="caps">
      <div class="cap c1">Tu clase entra <b>confusa.</b></div>
      <div class="cap c2">Sale como una guía <b>para entender.</b></div>
    </div>

    <!-- Outro -->
    <div class="outro">
      <div class="o-mark"><img src="../logo-mark.png" alt="Stramont"></div>
      <div class="o-name">Stramont</div>
      <div class="o-tag">Entiende. <b>No solo memorices.</b></div>
      <div class="o-cta">Pídela en montaguth.institute</div>
      <div class="o-url">montaguth.institute</div>
    </div>
  </div>

  <script>
    // Formato por query (?f=9x16|1x1|16x9). Por defecto 9x16.
    (function(){
      var f = (new URLSearchParams(location.search).get('f') || '9x16').toLowerCase();
      if(['9x16','1x1','16x9'].indexOf(f) === -1) f = '9x16';
      document.documentElement.className = 'f-' + f;
    })();
  </script>
</body>
</html>
