<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magandhi · Campañas</title>
<meta name="description" content="Campañas · presentación de productos del Área de Marketing de Magandhi.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../../marca-areas/marketing.png?v=1">
<link rel="apple-touch-icon" href="../../icono-app-180.png?v=2">

<link rel="preconnect" href="https://fonts.googleapis.com">

<!--
  MAGANDHI · Area de Marketing · Sub-area CAMPANAS · HOME/LISTA.
  Campanas es donde un producto se "viste" para salir a la tienda: se le pone
  hook, foto, ficha, precio y estado, y desde aqui se publica en magandhi.com.
  Es hermana de "Marketing Project" dentro del Area de Marketing.

  Profundidad de rutas: esta pagina vive DOS niveles bajo la raiz
  (marketing/campanas/), por eso:
    · auth-guard.js se incluye como '../../auth-guard.js'
    · marca.css sube '../../'
    · el nucleo compartido se importa como '../marketing-core.js' (una carpeta
      arriba, en marketing/). El core resuelve sus propios imports
      (supabase-config / auth-guard) relativos a SI MISMO, asi que una sola
      copia del nucleo sirve a esta profundidad tambien.

  El candado real es RLS server-side (tiene_acceso_marketing); ocultar UI es
  solo comodidad de UX. Toda ESCRITURA pasa por RPC (aqui: cm_publicar_campana).
-->
</head>
<body class="mk-body">

<!-- Guardia reutilizable: sin sesion, redirige al login de la raiz. -->
<script type="module" src="../../auth-guard.js"></script>

<main class="mk-wrap" id="cm-main" hidden>
  <div class="cm-barra">
    <p class="cm-barra-titulo">Productos en campaña</p>
    <div class="cm-barra-acciones">
      <button type="button" class="cm-btn-secundario" id="cm-reordenar-btn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/><path d="m7 3 2 2 2-2M7 21l2-2 2 2"/></svg>
        <span id="cm-reordenar-txt">Reordenar productos</span>
      </button>
      <a class="cm-btn-secundario" href="etiquetas.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        <span>Gestionar etiquetas</span>
      </a>
      <a class="cm-btn-primario" href="agregar.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Agregar campaña</span>
      </a>
    </div>
  </div>

  <!-- La lista se pinta por JS tras confirmar acceso. -->
  <div id="cm-lista" class="cm-lista" aria-live="polite"></div>
</main>

<script type="module">
  import {
    asegurarAcceso, montarHeader, ICONOS,
    supabase, escaparHTML, formatearNumero, urlPublicaImagen
  } from '../marketing-core.js';

  // ----------------------------------------------------------
  // Deriva la key de la version LIVIANA (-sm) de una imagen a partir del path
  // guardado (que apunta a la version GRANDE). agregar.html sube ambas con la
  // MISMA base y solo cambia el sufijo: "<base>.<ext>" (grande) y
  // "<base>-sm.<ext>" (liviana). El grid del panel consume la liviana para no
  // penalizar la carga del listado (recomendacion del ANDAMIOS). Como los
  // productos VIEJOS pueden no tener version -sm, la tarjeta define un fallback
  // a la grande en el onerror del <img> de fondo.
  // ----------------------------------------------------------
  function keyLiviana(path) {
    if (!path) return '';
    // Inserta '-sm' justo antes de la ultima extension (.webp/.jpg/...).
    const m = String(path).match(/^(.*)(\.[^.\/]+)$/);
    return m ? (m[1] + '-sm' + m[2]) : (path + '-sm');
  }

  // ----------------------------------------------------------
  // Iconos pequenos usados dentro de las tarjetas (inline, sobrios).
  // ----------------------------------------------------------
  const SVG = {
    editar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    publicar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>',
    despublicar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
    borrador: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    estrella: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M12 2 15.09 8.26 22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01Z"/></svg>',
    urgencia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
    // ejemplo: matraz de laboratorio (producto ficticio, de muestra).
    ejemplo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6.5L5.2 18a1.5 1.5 0 0 0 1.3 2.25h11a1.5 1.5 0 0 0 1.3-2.25L14 9.5V3"/><path d="M7.5 14h9"/></svg>',
    // retirar: caja archivada (baja logica, no borrado).
    retirar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M9 12h6"/></svg>',
    // asa: manija de arrastre (mismo set que la galeria de imagenes).
    asa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>'
  };

  const lista = document.getElementById('cm-lista');

  // ----------------------------------------------------------
  // ESTADO DEL REORDENAMIENTO (pedido B · arrastrar y soltar)
  // 'campanas' es el arreglo ORDENADO en memoria (como 'galeria' en los
  // formularios): el orden del arreglo = el orden que se persistira. El modo
  // "Reordenar" activa draggable + asa en las tarjetas y evita navegar al
  // arrastrar o soltar. 'arrastrandoId' marca la tarjeta tomada.
  // ----------------------------------------------------------
  let campanas = [];
  let modoReordenar = false;
  let arrastrandoId = null;
  const btnReordenar = document.getElementById('cm-reordenar-btn');
  const txtReordenar = document.getElementById('cm-reordenar-txt');

  // ----------------------------------------------------------
  // Carga la lista de campanas con su categoria (nombre + terna de color).
  // Ordena por 'orden'. Cada fila trae el join a campana_categoria.
  // ----------------------------------------------------------
  async function cargarCampanas() {
    lista.innerHTML = '<div class="cm-empty">Cargando campañas…</div>';

    const { data, error } = await supabase
      .from('campana_producto')
      .select('id, nombre, categoria_codigo, imagen_banner_path, precio_venta, sello_elegido, estrella, aviso_urgencia_activo, aviso_urgencia_cantidad, publicado, activo, es_placeholder, orden, campana_categoria ( nombre )')
      .order('orden', { ascending: true });

    if (error) {
      lista.innerHTML =
        '<div class="cm-empty err"><strong>No se pudo cargar la lista</strong>' +
        escaparHTML(error.message || 'Error al consultar las campañas.') + '</div>';
      return;
    }

    if (!data || data.length === 0) {
      campanas = [];
      // Sin productos no tiene sentido ofrecer el reordenamiento.
      if (modoReordenar) salirModoReordenar();
      if (btnReordenar) btnReordenar.hidden = true;
      lista.innerHTML =
        '<div class="cm-empty"><strong>Aún no hay campañas</strong>' +
        'Crea la primera con “Agregar campaña”: le pones nombre, foto, precio y su gancho, ' +
        'y cuando esté lista la publicas en la tienda.</div>';
      return;
    }

    // Guardamos el arreglo ya ordenado por 'orden' (como 'galeria' en los
    // formularios): el orden del arreglo es el que se arrastra y se persiste.
    campanas = data;
    // Recargar la lista cancela cualquier modo reordenar en curso.
    modoReordenar = false;
    if (btnReordenar) btnReordenar.hidden = false;
    pintarLista();
  }

  // ----------------------------------------------------------
  // Pinta la lista desde el arreglo 'campanas' en memoria y cablea todo. Se
  // llama tras cargar y tras cada reordenamiento (re-pinta como pintarGaleria).
  // ----------------------------------------------------------
  function pintarLista() {
    lista.classList.toggle('cm-modo-reordenar', modoReordenar);
    lista.innerHTML = campanas.map((c, i) => pintarTarjeta(c, i)).join('');
    cablearAcciones();
    cablearBanners();
    cablearReordenar();
    actualizarBotonReordenar();
  }

  // ----------------------------------------------------------
  // Refleja el estado del boton de la cabecera: "Reordenar productos" / "Hecho".
  // ----------------------------------------------------------
  function actualizarBotonReordenar() {
    if (!btnReordenar) return;
    btnReordenar.classList.toggle('activo', modoReordenar);
    if (txtReordenar) txtReordenar.textContent = modoReordenar ? 'Hecho' : 'Reordenar productos';
  }

  // ----------------------------------------------------------
  // Aplica el fondo de cada banner precargando la version LIVIANA (-sm) y, si
  // no existe (productos viejos que no la generaron), cayendo a la GRANDE. El
  // background-image de un <span> no dispara onerror, asi que se precarga con un
  // Image() y solo entonces se asigna la URL que si cargo.
  // ----------------------------------------------------------
  function cablearBanners() {
    lista.querySelectorAll('.cm-banner-imagen').forEach((el) => {
      const sm = el.dataset.sm || '';
      const grande = el.dataset.grande || '';
      const aplicar = (url) => {
        if (url) el.style.backgroundImage = 'url("' + url.replace(/"/g, '\\"') + '")';
      };
      if (!sm && !grande) return;
      // Preferir la liviana; si falla, la grande.
      const probar = new Image();
      probar.onload = () => aplicar(sm || grande);
      probar.onerror = () => aplicar(grande);
      probar.src = sm || grande;
    });
  }

  // ----------------------------------------------------------
  // Devuelve el HTML de una tarjeta. La paleta es FIJA (dorado de marca), igual
  // que la tienda publica: la categoria solo clasifica, no cambia el color.
  // ----------------------------------------------------------
  function pintarTarjeta(c, indice) {
    const cat = c.campana_categoria || null;
    const catNombre = cat?.nombre || 'Sin categoría';

    const style =
      '--cm-acento:#C28A3A;' +
      '--cm-acento-cl:#D9AE6E;' +
      '--cm-acento-sombra:rgba(194,138,58,.16);';

    const id = escaparHTML(c.id);
    const hrefEditar = 'editar.html?id=' + encodeURIComponent(c.id);

    // Fondo del banner con la imagen. Se usa la URL PUBLICA (urlPublicaImagen),
    // no el path crudo, o el navegador no encuentra la foto. El grid consume la
    // version LIVIANA (-sm) para cargar mas rapido, con FALLBACK a la grande si
    // la liviana no existe (productos viejos); el swap lo hace cablearBanners()
    // tras pintar, precargando la -sm y cayendo a la grande en su onerror.
    const urlGrande = c.imagen_banner_path ? urlPublicaImagen(c.imagen_banner_path) : '';
    const urlSm = c.imagen_banner_path ? urlPublicaImagen(keyLiviana(c.imagen_banner_path)) : '';
    const imagen = urlGrande
      ? '<span class="cm-banner-imagen" data-sm="' + escaparHTML(urlSm) + '" data-grande="' + escaparHTML(urlGrande) + '"></span>'
      : '';

    const precio = (c.precio_venta === null || c.precio_venta === undefined)
      ? '<span class="cm-precio-vacio">Sin precio definido</span>'
      : '<span class="cm-precio mk-num">$' + formatearNumero(c.precio_venta) + '</span>' +
        '<span class="cm-precio-moneda">COP</span>';

    const esEjemplo = !!c.es_placeholder;
    const retirada = c.activo === false;

    // Chips de estado. Publicado vs Borrador siempre; estrella y urgencia solo
    // cuando corresponden (el aviso es MANUAL: "Solo X disponibles"). Los
    // productos de EJEMPLO (ficticios) se marcan con su propio chip; si ya se
    // retiraron (baja logica, activo=false) se rotula como "Retirado".
    const chips = [];
    if (retirada) {
      chips.push('<span class="cm-chip retirada">' + SVG.retirar + 'Retirado</span>');
    } else if (c.publicado) {
      chips.push('<span class="cm-chip publicado">' + SVG.check + 'Publicado</span>');
    } else {
      chips.push('<span class="cm-chip borrador">' + SVG.borrador + 'Borrador</span>');
    }
    if (esEjemplo) {
      chips.push('<span class="cm-chip ejemplo">' + SVG.ejemplo + 'Ejemplo</span>');
    }
    if (c.estrella) {
      chips.push('<span class="cm-chip estrella">' + SVG.estrella + 'Estrella</span>');
    }
    if (c.aviso_urgencia_activo && Number(c.aviso_urgencia_cantidad) > 0) {
      chips.push('<span class="cm-chip urgencia">' + SVG.urgencia +
        'Solo ' + formatearNumero(c.aviso_urgencia_cantidad) + ' disponibles</span>');
    }

    // Boton de publicar/despublicar segun el estado actual. Una campana ya
    // retirada (activo=false) no muestra el interruptor de publicar (esta fuera
    // de la tienda por baja logica): su unica huella es el chip "Retirado".
    const accionPub = retirada
      ? ''
      : (c.publicado
          ? '<button type="button" class="cm-accion despublicar" data-id="' + id + '" data-publicar="false">' +
              SVG.despublicar + '<span>Despublicar</span></button>'
          : '<button type="button" class="cm-accion publicar" data-id="' + id + '" data-publicar="true">' +
              SVG.publicar + '<span>Publicar</span></button>');

    // Boton de RETIRAR: solo para productos de EJEMPLO que aun no se retiraron.
    // Decision de Oro del dueno: un ficticio NO se edita para volverlo real; se
    // RETIRA (baja logica) y se crea uno nuevo. Empuja a ese flujo, no a editar.
    const accionRetirar = (esEjemplo && !retirada)
      ? '<button type="button" class="cm-accion retirar" data-retirar="' + id + '">' +
          SVG.retirar + '<span>Retirar ejemplo</span></button>'
      : '';

    // En modo reordenar: la tarjeta es draggable, muestra asa de arrastre y su
    // POSICION derivada del indice (#1..#N, nunca editable, como el pie de la
    // galeria). Fuera de ese modo la tarjeta queda EXACTAMENTE igual que hoy.
    const asa = modoReordenar
      ? '<span class="cm-card-asa" aria-hidden="true">' + SVG.asa + '</span>' +
        '<span class="cm-card-pos" aria-hidden="true">#' + (indice + 1) + '</span>'
      : '';
    const dragAttrs = modoReordenar ? ' draggable="true"' : '';

    return '' +
      '<article class="cm-card' + (retirada ? ' es-retirada' : '') + (esEjemplo ? ' es-ejemplo' : '') + '"' + dragAttrs + ' data-id="' + id + '" style="' + style + '">' +
        asa +
        '<a class="cm-banner" href="' + hrefEditar + '">' +
          imagen +
          '<span class="cm-banner-cont">' +
            '<span class="cm-cat">' + escaparHTML(catNombre) + '</span>' +
            '<h3 class="cm-nombre">' + escaparHTML(c.nombre) + '</h3>' +
          '</span>' +
        '</a>' +
        '<div class="cm-cuerpo">' +
          '<div class="cm-precio-fila">' + precio + '</div>' +
          '<div class="cm-chips">' + chips.join('') + '</div>' +
        '</div>' +
        '<p class="cm-card-msg" data-msg="' + id + '" hidden></p>' +
        '<div class="cm-acciones">' +
          '<a class="cm-accion editar" href="' + hrefEditar + '">' + SVG.editar + '<span>Editar</span></a>' +
          accionPub +
          accionRetirar +
        '</div>' +
      '</article>';
  }

  // ----------------------------------------------------------
  // Cablea los botones Publicar/Despublicar. Cada uno llama a la RPC
  // cm_publicar_campana({p_id, p_publicado}) y refresca la lista al terminar.
  // ----------------------------------------------------------
  function cablearAcciones() {
    lista.querySelectorAll('.cm-accion.publicar, .cm-accion.despublicar').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const publicar = btn.dataset.publicar === 'true';
        const msg = lista.querySelector('[data-msg="' + CSS.escape(id) + '"]');
        if (msg) { msg.hidden = true; msg.textContent = ''; }

        btn.disabled = true;
        const { error } = await supabase.rpc('cm_publicar_campana', {
          p_id: id,
          p_publicado: publicar
        });

        if (error) {
          btn.disabled = false;
          if (msg) {
            msg.textContent = 'No se pudo actualizar: ' + (error.message || 'error desconocido.');
            msg.hidden = false;
          }
          return;
        }
        // Exito: recargar para reflejar el nuevo estado (chip + boton).
        await cargarCampanas();
      });
    });

    // Boton RETIRAR (solo en productos de ejemplo). Llama a la RPC
    // cm_retirar_placeholder (baja logica: sale de la tienda y queda inactivo,
    // NO se borra). Se confirma antes, recordando la Decision de Oro: un
    // ejemplo NO se edita para volverlo real, se retira y se crea uno nuevo.
    lista.querySelectorAll('.cm-accion.retirar').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.retirar;
        const ok = window.confirm(
          'Retirar este producto de ejemplo.\n\n' +
          'Un producto de ejemplo NO se edita para volverlo real (heredaria su ' +
          'identidad). Lo correcto es retirarlo y crear uno nuevo cuando llegue ' +
          'el real.\n\n' +
          'Retirar no borra nada: solo lo saca de la tienda y lo deja inactivo. ' +
          '¿Continuar?'
        );
        if (!ok) return;

        const msg = lista.querySelector('[data-msg="' + CSS.escape(id) + '"]');
        if (msg) { msg.hidden = true; msg.textContent = ''; }

        btn.disabled = true;
        const { error } = await supabase.rpc('cm_retirar_placeholder', { p_id: id });

        if (error) {
          btn.disabled = false;
          if (msg) {
            msg.textContent = 'No se pudo retirar: ' + (error.message || 'error desconocido.');
            msg.hidden = false;
          }
          return;
        }
        await cargarCampanas();
      });
    });
  }

  // ----------------------------------------------------------
  // REORDENAR (pedido B) · arrastrar y soltar NATIVO, reutilizando el patron ya
  // aprobado de la galeria de imagenes (agregar.html / editar.html):
  //   dragstart -> marca el id arrastrado + clase 'arrastrando'
  //   dragover  -> preventDefault + clase 'sobre' en el destino
  //   dragleave -> quita 'sobre'
  //   drop      -> reordena el arreglo en memoria y re-pinta
  //   dragend   -> limpia estados
  // En modo normal estos manejadores NO se cablean (las tarjetas no son
  // draggable) y la tarjeta se comporta igual que hoy.
  // ----------------------------------------------------------

  // Mueve en 'campanas' el item 'desdeId' justo antes de 'hastaId' (misma
  // semantica que reordenarGaleria en los formularios) y re-pinta.
  function reordenarCampanas(desdeId, hastaId) {
    if (desdeId === hastaId) return;
    const desde = campanas.findIndex((c) => c.id === desdeId);
    const hasta = campanas.findIndex((c) => c.id === hastaId);
    if (desde < 0 || hasta < 0) return;
    const [mov] = campanas.splice(desde, 1);
    campanas.splice(hasta, 0, mov);
    pintarLista();
  }

  // Cablea el drag & drop de las tarjetas (solo tiene efecto en modo reordenar,
  // que es cuando las tarjetas se pintan con draggable="true"). En modo normal
  // no hay tarjetas draggable y, por seguridad, se neutralizan los clicks de los
  // enlaces/botones para que arrastrar no dispare una navegacion accidental.
  function cablearReordenar() {
    if (!modoReordenar) return;
    lista.querySelectorAll('.cm-card').forEach((el) => {
      el.addEventListener('dragstart', (e) => {
        arrastrandoId = el.dataset.id;
        el.classList.add('arrastrando');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', arrastrandoId); } catch (_) { /* ignore */ }
      });
      el.addEventListener('dragend', () => {
        arrastrandoId = null;
        el.classList.remove('arrastrando');
        lista.querySelectorAll('.cm-card').forEach((x) => x.classList.remove('sobre'));
      });
      el.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        el.classList.add('sobre');
      });
      el.addEventListener('dragleave', () => el.classList.remove('sobre'));
      el.addEventListener('drop', (e) => {
        e.preventDefault();
        el.classList.remove('sobre');
        const desde = arrastrandoId;
        if (desde) reordenarCampanas(desde, el.dataset.id);
      });
    });
    // En modo reordenar, los enlaces (banner, Editar) y botones de la tarjeta no
    // deben navegar ni actuar: el objetivo es mover, no abrir.
    lista.querySelectorAll('.cm-card a, .cm-card button').forEach((el) => {
      el.addEventListener('click', (e) => {
        if (modoReordenar) { e.preventDefault(); e.stopPropagation(); }
      });
    });
  }

  // Sale del modo reordenar (sin persistir): usado al recargar o cuando ya no
  // hay productos. La persistencia ocurre en salirYPersistir().
  function salirModoReordenar() {
    modoReordenar = false;
    arrastrandoId = null;
  }

  // Persiste el orden visual actual con UNA sola llamada a la RPC atomica
  // cm_reordenar_campanas(p_ids uuid[]) (creada en FEAT-001): reasigna
  // orden=1..N sin huecos en el orden recibido y valida tiene_acceso_marketing.
  // El cliente NUNCA hace update directo a la tabla. En error, avisa en la
  // primera tarjeta (patron cm-card-msg) y recarga para no dejar el orden
  // visual inconsistente con la base.
  async function persistirOrden() {
    const p_ids = campanas.map((c) => c.id);
    if (!p_ids.length) return;
    const { error } = await supabase.rpc('cm_reordenar_campanas', { p_ids });
    if (error) {
      const primero = campanas[0]?.id;
      const msg = primero
        ? lista.querySelector('[data-msg="' + CSS.escape(primero) + '"]')
        : null;
      if (msg) {
        msg.textContent = 'No se pudo guardar el nuevo orden: ' +
          (error.message || 'error desconocido.') + ' Se recargó la lista.';
        msg.hidden = false;
      }
      // Recargar para reflejar el orden REAL de la base (evita quedar fuera de
      // sincronia con lo que ve el home).
      await cargarCampanas();
    }
  }

  // Boton de la cabecera: alterna entre modo normal y modo reordenar. Al pasar
  // a "Hecho" persiste el orden actual.
  if (btnReordenar) {
    btnReordenar.addEventListener('click', async () => {
      if (!modoReordenar) {
        modoReordenar = true;
        pintarLista();
        return;
      }
      // Confirmar ("Hecho"): persistir y salir del modo.
      modoReordenar = false;
      arrastrandoId = null;
      pintarLista();
      await persistirOrden();
    });
  }

  (async () => {
    const main = document.getElementById('cm-main');
    const acceso = await asegurarAcceso(document.body, '../index.html');
    if (!acceso) return;

    montarHeader({
      titulo: 'Campañas',
      kicker: 'PRESENTACIÓN DE PRODUCTOS',
      lead: 'Campañas es donde un producto se viste para salir a la tienda: le pones su gancho, su foto, su ficha y su precio, y desde aquí lo publicas en magandhi.com. Cada tarjeta lleva el color de su categoría.',
      sesion: acceso.sesion,
      areaLabel: 'ÁREA DE MARKETING',
      volverHref: '../index.html',
      volverTexto: 'Marketing'
    });

    // Los data-ico del header/tarjetas de navegacion (si hubiera) se pintan aqui.
    document.querySelectorAll('[data-ico]').forEach((el) => {
      el.innerHTML = ICONOS[el.dataset.ico] || '';
    });

    await cargarCampanas();
    main.hidden = false;
  })();
</script>
