<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magandhi · Email marketing</title>
<meta name="description" content="Email marketing · Área de Marketing de MAGANDHI.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../../marca-areas/marketing.png?v=1">
<link rel="apple-touch-icon" href="../../icono-app-180.png?v=2">
<meta name="theme-color" content="#101C33">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../marca.css?v=2">
<link rel="stylesheet" href="../marketing.css?v=3">
<link rel="stylesheet" href="email-marketing.css?v=8">

<!--
  MAGANDHI · Marketing · EMAIL MARKETING · RESUMEN (tramo EM1).
  Tablero de la lista: suscritos, estados, crecimiento por semana, fuentes,
  temas, clientes con correo que aun no estan en la lista y el pulso de los
  correos de seguimiento. Todo en UNA llamada: RPC em_resumen() (security
  definer, guardado por tiene_acceso_email_marketing()). Diseno en
  docs/PLANO-EMAIL-MARKETING.md.
-->
</head>
<body class="mk-body">

<script type="module" src="../../auth-guard.js"></script>

<main class="mk-wrap" id="em-main" hidden>
  <div id="em-aviso"></div>
  <div id="em-contenido"><p class="mk-empty">Cargando…</p></div>
</main>

<script type="module">
  import {
    supabase, ICONOS, escaparHTML, formatearNumero, asegurarAccesoEM, montarArea,
    ESTADOS, FUENTES, formatearFecha, fechaRelativa, mensajeError
  } from './em-core.js';

  const $ = (id) => document.getElementById(id);
  const n = (x) => Number(x) || 0;

  let esAdmin = false;
  let salud = null; // em_salud_lista (EM5); null si la migracion aun no esta
  let captura = null; // em_captura_estado (EM6); null si la migracion aun no esta

  function bloqueCaptura() {
    if (!captura) return '';
    const on = !!captura.activa;
    const btn = esAdmin
      ? (on ? '<button class="em-btn-sec" type="button" id="cap-btn" data-activar="0">Apagar el formulario</button>'
            : '<button class="mk-btn" type="button" id="cap-btn" data-activar="1"' + (captura.politica_publicada ? '' : ' disabled title="Primero registra la política"') + '>Encender el formulario</button>')
      : '';
    return '<section class="em-card" style="margin-top:16px"><h2 class="em-card-titulo">Formulario de la tienda</h2>' +
      '<p style="margin:0 0 12px;font-size:14px"><span class="em-badge ' + (on ? 'ok' : 'pendiente') + '">' + (on ? 'Encendido' : 'Apagado') + '</span> ' +
        (on ? 'magandhi.com muestra el formulario de novedades. Cada persona confirma desde su correo antes de entrar a la lista.'
            : 'La tienda no muestra el formulario.' + (captura.politica_publicada ? '' : ' Para encenderlo, primero registra la política.')) + '</p>' +
      '<div class="em-datos em-datos-3">' +
        '<div class="em-dato"><span class="k">Esperando confirmación</span><span class="v">' + formatearNumero(captura.pendientes) + '</span></div>' +
        '<div class="em-dato"><span class="k">Solicitudes · 30 días</span><span class="v">' + formatearNumero(captura.solicitudes_30d) + '</span></div>' +
        '<div class="em-dato"><span class="k">Confirmadas · 30 días</span><span class="v">' + formatearNumero(captura.confirmadas_30d) + '</span></div>' +
      '</div>' +
      (n(captura.contactos_borrador) ? '<p class="em-pie">' + formatearNumero(captura.contactos_borrador) + ' contactos entraron con una versión borrador de la política: cuando registres la versión definitiva, no recibirán campañas reales.</p>' : '') +
      '<p class="em-msg" id="cap-msg" hidden></p>' +
      (btn ? '<div class="em-form-acciones" style="justify-content:flex-start;margin-top:12px">' + btn + '</div>' : '') +
    '</section>';
  }
  function cablearCaptura() {
    const b = document.getElementById('cap-btn');
    if (!b) return;
    b.addEventListener('click', async () => {
      const activar = b.dataset.activar === '1';
      if (activar && !window.confirm('Se mostrará el formulario de novedades en magandhi.com. ¿Encenderlo?')) return;
      b.disabled = true;
      const { error } = await supabase.rpc('em_config_captura', { p_activa: activar });
      if (error) { const m = document.getElementById('cap-msg'); m.hidden = false; m.className = 'em-msg err'; m.textContent = mensajeError(error); b.disabled = false; return; }
      location.reload();
    });
  }

  function bloqueSalud() {
    if (!salud) return '';
    const env = n(salud.enviados);
    const med = (k, v, lim, txtLim) => {
      const alerta = v !== null && v !== undefined && Number(v) >= lim;
      const ancho = v === null || v === undefined ? 0 : Math.min(100, (Number(v) / lim) * 100);
      return '<div class="sl-med' + (alerta ? ' alerta' : '') + '"><span class="k">' + k + '</span>' +
        '<span class="v">' + (v === null || v === undefined ? '—' : String(v).replace('.', ',') + '%') + '</span>' +
        '<span class="lim">' + txtLim + '</span><div class="sl-barra"><span style="width:' + ancho + '%"></span></div></div>';
    };
    const sinWebhook = !salud.ultimo_evento;
    return '<section class="em-card" style="margin-top:16px"><h2 class="em-card-titulo">Salud de la lista · 60 días</h2>' +
      (sinWebhook
        ? '<p class="em-vacio-mini">Todavía no ha llegado ningún aviso de Resend. Al conectar el webhook (tramo EM5) aquí verás rebotes y quejas contra los límites de Resend.</p>'
        : '<div class="sl-fila">' +
            med('Rebotes', salud.tasa_rebote, n(salud.limite_rebote), 'Límite de Resend: menos de 4 %') +
            med('Marcados como spam', salud.tasa_queja, n(salud.limite_queja), 'Límite de Resend: menos de 0,08 %') +
          '</div>' +
          '<p class="em-pie">Sobre ' + formatearNumero(env) + ' correos enviados (campañas y avisos del pedido). ' +
            (n(salud.suprimidos_auto_30d) ? formatearNumero(salud.suprimidos_auto_30d) + ' contactos salieron solos de la lista en 30 días por rebote, spam o baja desde el correo. ' : '') +
            'Último aviso de Resend: ' + escaparHTML(fechaRelativa(salud.ultimo_evento).toLowerCase()) + '.</p>') +
      '</section>';
  }
  function avisoPolitica(cfg) {
    if (cfg && cfg.politica_publicada) {
      if (/^borrador/i.test(cfg.politica_version || '')) {
        return '<div class="em-aviso">' + ICONOS.escudo + '<div><strong>Política en versión borrador · ' + escaparHTML(cfg.politica_version) + '</strong>' +
          '<p>Sirve para probar todo de punta a punta. Quien se suscriba con esta versión nunca recibirá una campaña real: al registrar la versión definitiva quedan fuera solos.</p>' +
          (esAdmin ? '<button class="em-btn-sec" type="button" id="pol-abrir">Registrar la versión definitiva</button>' + formPolitica(cfg) : '') + '</div></div>';
      }
      return '<div class="em-aviso ok">' + ICONOS.escudo + '<div><strong>Política de tratamiento de datos publicada · versión ' + escaparHTML(cfg.politica_version) + '</strong>' +
        '<p>Las campañas están habilitadas y cada nueva autorización queda registrada bajo esta versión.' +
        (cfg.politica_url ? ' <a href="' + escaparHTML(cfg.politica_url) + '" target="_blank" rel="noopener">Ver la política</a>.' : '') + '</p>' +
        (esAdmin ? '<button class="em-btn-sec" type="button" id="pol-abrir">Registrar una nueva versión</button>' + formPolitica(cfg) : '') + '</div></div>';
    }
    return '<div class="em-aviso">' + ICONOS.escudo + '<div><strong>Política de tratamiento de datos: pendiente</strong>' +
      '<p>Ya puedes registrar contactos que te autoricen, siempre con su evidencia, y preparar campañas con pruebas a tu correo. El envío a tus contactos y el formulario de la tienda se habilitan cuando la política esté publicada en magandhi.com.</p>' +
      (esAdmin ? '<button class="em-btn-sec" type="button" id="pol-abrir">Ya la publiqué: registrarla</button>' + formPolitica(cfg) : '') + '</div></div>';
  }
  function formPolitica(cfg) {
    return '<form class="em-politica-form" id="pol-form" hidden novalidate>' +
      '<div class="em-fila2"><label class="em-campo"><span>Dirección de la política</span><input class="mk-input" id="pol-url" placeholder="https://magandhi.com/politica-de-datos" value="' + escaparHTML((cfg && cfg.politica_url) || '') + '"></label>' +
      '<label class="em-campo"><span>Versión</span><input class="mk-input" id="pol-ver" maxlength="40" placeholder="1.0"></label></div>' +
      '<label class="em-confirmo"><input type="checkbox" id="pol-ok"><span>Confirmo que esta política ya está <strong>publicada y visible</strong> en esa dirección.</span></label>' +
      '<p class="em-msg" id="pol-msg" hidden></p>' +
      '<div class="em-form-acciones" style="justify-content:flex-start"><button class="mk-btn" type="submit">Registrar política</button></div></form>';
  }
  function cablearPolitica() {
    const ab = document.getElementById('pol-abrir'), f = document.getElementById('pol-form');
    if (!ab || !f) return;
    ab.addEventListener('click', () => { f.hidden = !f.hidden; if (!f.hidden) document.getElementById('pol-url').focus(); });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const m = document.getElementById('pol-msg');
      const show = (t, c) => { m.hidden = false; m.textContent = t; m.className = 'em-msg' + (c ? ' ' + c : ''); };
      if (!document.getElementById('pol-ok').checked) { show('Marca la confirmación.', 'err'); return; }
      const { error } = await supabase.rpc('em_config_politica', { p_publicada: true, p_url: document.getElementById('pol-url').value.trim(), p_version: document.getElementById('pol-ver').value.trim() });
      if (error) { show(mensajeError(error), 'err'); return; }
      location.reload();
    });
  }

  function graficoSemanas(semanas) {
    const W = 640, H = 190, padL = 28, padR = 8, padT = 18, padB = 28;
    const max = Math.max(1, ...semanas.map((s) => Math.max(n(s.altas), n(s.bajas))));
    const ancho = (W - padL - padR) / semanas.length;
    const bw = Math.min(16, ancho / 3);
    const y = (v) => padT + (H - padT - padB) * (1 - v / max);
    let barras = '';
    semanas.forEach((s, i) => {
      const cx = padL + ancho * i + ancho / 2;
      const a = n(s.altas), b = n(s.bajas);
      barras += '<rect class="alta" x="' + (cx - bw - 1) + '" y="' + y(a) + '" width="' + bw + '" height="' + (H - padB - y(a)) + '" rx="3"><title>' + a + ' altas</title></rect>';
      barras += '<rect class="bajab" x="' + (cx + 1) + '" y="' + y(b) + '" width="' + bw + '" height="' + (H - padB - y(b)) + '" rx="3"><title>' + b + ' bajas</title></rect>';
      if (a) barras += '<text class="val" x="' + (cx - bw / 2 - 1) + '" y="' + (y(a) - 4) + '" text-anchor="middle">' + a + '</text>';
      if (i % 2 === 1 || semanas.length <= 6) {
        const d = new Date(s.semana + 'T12:00:00');
        barras += '<text class="lbl" x="' + cx + '" y="' + (H - 9) + '" text-anchor="middle">' + d.getDate() + '/' + (d.getMonth() + 1) + '</text>';
      }
    });
    return '<svg class="em-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Altas y bajas por semana">' +
      '<line class="eje" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + (H - padB) + '" y2="' + (H - padB) + '"/>' +
      '<text class="lbl" x="2" y="' + (padT + 4) + '">' + max + '</text>' + barras + '</svg>' +
      '<div class="em-ley-mini"><span><i class="alta"></i>Altas (incluye reactivaciones)</span><span><i class="baja"></i>Bajas</span></div>';
  }

  function filasBarras(pares, total) {
    if (!pares.length) return '<p class="em-vacio-mini">Aún sin datos.</p>';
    return '<ul class="em-filas">' + pares.map(([txt, v]) => {
      const pct = total ? Math.round((v / total) * 100) : 0;
      return '<li><div class="em-fila-top"><span>' + escaparHTML(txt) + '</span><b>' + formatearNumero(v) +
        ' <span class="em-tenue" style="font-weight:400">· ' + pct + '%</span></b></div>' +
        '<div class="em-fila-barra"><span style="width:' + pct + '%"></span></div></li>';
    }).join('') + '</ul>';
  }

  function pintar(r) {
    $('em-aviso').innerHTML = avisoPolitica(r.config);
    cablearPolitica();
    const pe = r.por_estado || {};
    const suscritos = n(pe.suscrito);
    const total = n(r.total);

    if (!total) {
      $('em-contenido').innerHTML =
        '<div class="em-bienvenida"><div class="ico">' + ICONOS.sobre + '</div>' +
          '<h2>Tu lista empieza aquí</h2>' +
          '<p>Registra a las personas que te autoricen recibir novedades y ofertas. Cada alta guarda la prueba del permiso: por dónde lo dio, cuándo y qué texto aceptó.</p>' +
          '<a class="mk-btn" href="contactos.html?nuevo=1">' + ICONOS.usuarioMas + ' Agregar el primer contacto</a>' +
        '</div>' +
        insightClientes(r) + bloqueCaptura() + bloqueSalud() + bloqueSeguimiento(r);
      cablearCaptura();
      return;
    }

    const segm = [
      ['suscrito', n(pe.suscrito)],
      ['pendiente', n(pe.pendiente_confirmacion)],
      ['baja', n(pe.baja)],
      ['problema', n(pe.rebotado) + n(pe.queja)]
    ];
    const barra = '<div class="em-barra" role="img" aria-label="Distribución por estado">' +
      segm.filter(([, v]) => v).map(([c, v]) => '<span class="' + c + '" style="width:' + (v / total * 100) + '%"></span>').join('') + '</div>';
    const leyenda = '<div class="em-leyenda">' + [
      ['suscrito', 'Suscritos', n(pe.suscrito)],
      ['pendiente', 'Por confirmar', n(pe.pendiente_confirmacion)],
      ['baja', 'De baja', n(pe.baja)],
      ['problema', 'Rebote o spam', n(pe.rebotado) + n(pe.queja)]
    ].map(([c, t, v]) => '<span class="em-leyenda-item"><i class="' + c + '"></i>' + t + '<b>' + formatearNumero(v) + '</b></span>').join('') + '</div>';

    const vinculadosPct = suscritos ? Math.round(n(r.vinculados) / suscritos * 100) : 0;
    const fuentes = Object.entries(r.por_fuente || {}).map(([k, v]) => [FUENTES[k] || k, n(v)]).sort((a, b) => b[1] - a[1]);
    const temas = (r.por_tema || []).map((t) => [t.nombre, n(t.suscritos)]);

    $('em-contenido').innerHTML =
      '<section class="mk-hero em-hero" aria-label="Suscritos">' +
        '<div class="mk-hero-main"><span class="mk-hero-lbl">Personas que reciben tus correos</span>' +
          '<span class="mk-hero-num">' + formatearNumero(suscritos) + '<span class="mk-hero-unidad">suscritos</span></span>' +
          '<span class="mk-hero-sub">De ' + formatearNumero(total) + ' contactos registrados en total</span></div>' +
        '<div class="mk-hero-meta">' +
          '<div class="mk-hero-dato"><span class="k">Altas · 30 días</span><span class="v">+' + formatearNumero(r.altas_30d) + '</span></div>' +
          '<div class="mk-hero-dato"><span class="k">Bajas · 30 días</span><span class="v">' + formatearNumero(r.bajas_30d) + '</span></div>' +
          '<div class="mk-hero-dato"><span class="k">Ya son clientes</span><span class="v">' + vinculadosPct + '%</span></div>' +
        '</div>' +
        '<div class="em-hero-acciones">' +
          '<a class="em-btn-claro" href="contactos.html?nuevo=1">' + ICONOS.usuarioMas + ' Agregar contacto</a>' +
          '<a class="em-btn-borde" href="contactos.html">Ver la lista</a>' +
        '</div>' +
      '</section>' +

      '<div class="em-grid c3">' +
        '<section class="em-card"><h2 class="em-card-titulo">Crecimiento · últimas 12 semanas</h2>' + graficoSemanas(r.semanas || []) + '</section>' +
        '<section class="em-card"><h2 class="em-card-titulo">Estado de la lista</h2>' + barra + leyenda +
          '<p class="em-pie">Los contactos de baja, rebotados o que marcaron spam nunca reciben campañas, aunque estén en un segmento.</p></section>' +
      '</div>' +

      '<div class="em-grid c2">' +
        '<section class="em-card"><h2 class="em-card-titulo">Por dónde llegaron <span class="em-tenue" style="text-transform:none;letter-spacing:0;font-weight:400">suscritos</span></h2>' + filasBarras(fuentes, suscritos) + '</section>' +
        '<section class="em-card"><h2 class="em-card-titulo">Qué quieren recibir</h2>' + filasBarras(temas, suscritos) +
          '<p class="em-pie">Cada persona puede elegir uno o ambos temas.</p></section>' +
      '</div>' +
      insightClientes(r) + bloqueCaptura() + bloqueSalud() + bloqueSeguimiento(r);
    cablearCaptura();
  }

  function insightClientes(r) {
    const k = n(r.clientes_con_correo_sin_contacto);
    if (!k) return '';
    return '<div class="em-insight">' + ICONOS.info + '<p><strong>' + formatearNumero(k) +
      (k === 1 ? ' cliente tiene' : ' clientes tienen') + ' correo y aún no ' + (k === 1 ? 'está' : 'están') + ' en la lista.</strong> ' +
      'No se agregan solos: comprar no es autorizar publicidad. Pregúntales en su próxima conversación si quieren recibir novedades.</p></div>';
  }

  function bloqueSeguimiento(r) {
    const s = r.seguimiento_30d || {};
    return '<section class="em-card" style="margin-top:16px"><h2 class="em-card-titulo">Correos de seguimiento · 30 días <a href="seguimiento.html">Ver historial</a></h2>' +
      '<div class="em-datos">' +
        '<div class="em-dato"><span class="k">Enviados</span><span class="v">' + formatearNumero(s.enviados) + '</span></div>' +
        '<div class="em-dato"><span class="k">Fallidos</span><span class="v' + (n(s.fallidos) ? ' err' : '') + '">' + formatearNumero(s.fallidos) + '</span></div>' +
      '</div>' +
      '<p class="em-pie">Los avisos de cada etapa del pedido, enviados desde Seguimiento de pedidos.' +
        (s.ultimo ? ' Último: ' + escaparHTML(fechaRelativa(s.ultimo).toLowerCase()) + ' (' + escaparHTML(formatearFecha(s.ultimo)) + ').' : '') + '</p></section>';
  }

  (async () => {
    const acceso = await asegurarAccesoEM(document.body, '../index.html');
    if (!acceso) return;
    esAdmin = acceso.perfil && acceso.perfil.rol === 'admin';
    montarArea({
      activa: 'resumen',
      titulo: 'Email marketing',
      lead: 'Tu lista propia de personas que autorizaron recibir novedades y ofertas, con la prueba de cada permiso. Aquí nacen los segmentos y las campañas.',
      sesion: acceso.sesion
    });
    $('em-main').hidden = false;
    const [{ data, error }, sl, cp] = await Promise.all([supabase.rpc('em_resumen'), supabase.rpc('em_salud_lista'), supabase.rpc('em_captura_estado')]);
    salud = sl && !sl.error ? sl.data : null;
    captura = cp && !cp.error ? cp.data : null;
    if (error) {
      $('em-contenido').innerHTML = '<div class="mk-empty">' + (/em_resumen|function/i.test(error.message || '')
        ? 'Falta aplicar la migración <strong>20261009000000_email_marketing_em1.sql</strong> en Supabase.'
        : 'No se pudo cargar el resumen: <strong>' + escaparHTML(error.message) + '</strong>') + '</div>';
      return;
    }
    pintar(data || {});
  })();
</script>

</body>
</html>
